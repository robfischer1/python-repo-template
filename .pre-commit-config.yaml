# Pre-commit for THE TEMPLATE ITSELF — not the config it stamps into stars.
# Until 2026-08-12 every *-repo-template gated its CHILDREN and carried nothing of
# its own, so nothing checked copier.yml for valid YAML, ci-matrix.toml for valid
# TOML, or this repo for a committed conflict marker. In frontend-repo-template
# that gap let an inlined shell command whose echo text contained ": " break
# copier.yml as YAML, caught only because the render matrix parses it in passing.
#
# WHY template/ IS EXCLUDED. Everything under template/ is jinja SOURCE, not the
# rendered result: pyproject.toml.jinja is not valid TOML, `{% if x %}name{% endif %}`
# is not a filename, and check-yaml reads a `{{ }}` scalar as an alias. Parsing
# the RENDERED tree — with answers substituted — is the render matrix's job, and
# it does that properly. This gate checks the SOURCE repo.
#
# No end-of-file-fixer: removed fleet-wide 2026-08-08 after a 24-repo red-CI
# cascade, and it cannot run in a forge-git-locked primary at all.
default_install_hook_types: [pre-commit, pre-push]
exclude: '^(template/|\.claude/|\.specify/|\.furnace/)'
repos:
# HOOK REPOS COME FROM OUR MIRROR, not github. pre-commit CLONES each `repo:`,
# and until 2026-08-22 every gate run in the fleet fetched these from github.com
# on each cold pre-commit cache — 53 repos pinning pre-commit-hooks, 47 ruff, 41
# detect-secrets. A cold-cache github fetch is what reddened a cerberus gate with
# "Executable `detect-secrets-hook` not found" while the env was still building.
#
# NEXUS CANNOT SERVE THIS. It is the fleet's package edge and gate.yml routes pip
# and uv through its pypi proxy, but Nexus 3.94.1 has no git format — the
# `gitlfs` one is LFS objects, not clones, and a raw proxy 404s the
# git-upload-pack handshake. Forgejo pull-mirrors are the only mechanism that
# serves a clone (rob/infra#1811, `hooks` org, 24h interval, prune on).
#
# RENOVATE STILL BUMPS THESE. Its pre-commit manager supports the `forgejo-tags`
# datasource and it already runs against this Forgejo as its platform. Reading
# revs from the mirror also means it can never propose a tag the mirror has not
# synced yet — the pin and the source cannot drift apart.
  - repo: https://forgejo.notusmi.com/hooks/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      # copier.yml is the file that actually broke.
      - id: check-yaml
        stages: [pre-commit]
      # ci-matrix.toml declares the render cases and the [update] contract.
      - id: check-toml
        stages: [pre-commit]

  - repo: local
    hooks:
      # THE REAL GATE, at pre-push: the same matrices CI runs, so a push that
      # would red template-ci fails locally first. They live in foundry-stocks so
      # all five templates share one definition; absent, they NOTICE rather than
      # block, the way this fleet already treats a missing opengrep.
      - id: render-matrix
        name: copier render matrix (every case renders; crossings hold)
        entry: >-
          bash -c 'S=${FOUNDRY_STOCKS:-../foundry-stocks};
          [ -f "$S/ci/lib/template_render_matrix.py" ] ||
          { echo "foundry-stocks not at $S — skipping locally (CI enforces)"; exit 0; };
          python3 "$S/ci/lib/template_render_matrix.py" --template .'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: update-matrix
        name: copier update matrix (a bump may not eat what a star owns)
        entry: >-
          bash -c 'S=${FOUNDRY_STOCKS:-../foundry-stocks};
          [ -f "$S/ci/lib/template_update_matrix.py" ] ||
          { echo "foundry-stocks not at $S — skipping locally (CI enforces)"; exit 0; };
          python3 "$S/ci/lib/template_update_matrix.py" --template .'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
