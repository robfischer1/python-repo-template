# Python-repo copier template — stamps a standard Forge Python project.
# `mcp = true`  -> a container-ready FastMCP service (the formalized vault-mcp
#                 shape: server.py, mcp[cli], Dockerfile/compose, deploy gate).
# `mcp = false` -> a plain Python library / CLI: the same QA/CI/lint spine,
#                 no service machinery. Realizes the service-repo standard:
# furnace/docs/service-repo-standard.md. copier lays the pure-code body; the
# governance (`.claude/`, AGENTS.md) is not a copier task: it is cast on the
# foundry-stocks landing and laid onto a host by gavel.

_subdirectory: template
_min_copier_version: "9.0.0"

# dagger.json IS RETIRED (2026-10-24). It declared foundry-tools as the repo's
# dagger toolchain for `dagger check` / `dagger call foundry-tools …`. No recipe
# calls dagger any more (check, gate and the dev verbs ask the door), so the
# template stops rendering it. No migration removes it: `copier update` deletes
# a file the old version rendered and the new one does not, when the star never
# edited it (measured with copier 9.17.2 on a go star, the same mechanism: `D
# dagger.json`, and nothing else moved). A star that edited its dagger.json
# drops it by hand. The door's readers only ever looked for a dagger.json WITH
# an sdk (a module, i.e. foundry-tools), so a consumer losing its sdk-free one
# changes no derived product.
# `_skip_if_exists` = every rendered path. It used to except dagger.json (copier
# owned it outright, now retired) and pyproject.toml too, as
# "the one merge seam left"; THE SEAM IS CLOSED (2026-09-30, the note on
# pyproject.toml in the list below) and the header kept saying otherwise. An
# earlier version of this line also named .gitignore as a second seam while
# .gitignore sat in the list — corrected 2026-09-14, the same repair
# go-repo-template#7 made to its own header. It scopes copier to what copier is
# good at: create-if-absent for the star-owned stubs (README/docs/source/config)
# on birth, and nothing else on update. A star builds out its README and src after
# birth; a `copier update`/anneal must NOT 3-way-merge them (the fleet-wide
# README conflict that failed the anneal arm closed). The foundry conformance
# files (editorconfig, …) are skipped here so update never
# conflicts them; anneal CLOBBERS them from a fresh render (Flame C2) — a
# conformance surface is enforced, not merged. Paths are RENDERED destination
# paths (template/ stripped by _subdirectory, .jinja stripped).
#
# THIS LIST IS NO LONGER KEPT IN SYNC WITH ANYTHING, and the line saying it was
# is removed rather than reworded. It read "Kept in sync with hephaestus
# `ownership.py`'s non-seam set (Flame C1)". That file was deleted on 2026-08-07
# in hephaestus d202dce, "burn the Python tree — the deployed star is Go, the
# tools are Rust", so the sync partner has been gone ~7 weeks and the claim
# outlived it. It is the second dead cross-reference this one comment block was
# carrying; the other is written up against pyproject.toml below, and both were
# a deletion elsewhere that nobody propagated back to the prose asserting it.
_skip_if_exists:
  # star-owned: rendered once at birth, then the star's
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - SECURITY.md
  - src/**
  - tests/**
  # THE SEAM IS CLOSED, 2026-09-30 — pyproject.toml joins the list, last of the
  # five templates to do it. The paragraph this replaces argued the opposite,
  # with real measurements, and was right when it was written. Its load-bearing
  # clause stopped being true and nobody noticed.
  #
  # IT DEFERRED TO A DETECTOR THAT NO LONGER EXISTS. The argument was: skipping
  # would withhold sixteen tool-config deliveries to prevent a clobber, so keep
  # the seam and catch regressions with foundry-stocks' manifest guard instead.
  # That guard was `ci/lib/manifest_guard.py`, 1,137 lines, hardened across five
  # commits to 2026-08-23 (the python floor at four writers, then 24 projected
  # strictness keys to 209). It was DELETED on 2026-09-14 in foundry-stocks
  # 97b20c9, "delete the seven ci/lib scripts nothing runs" — correctly, because
  # the gate had moved to foundry-tools' Dagger atoms and nothing reached it any
  # more. That commit's own body lists what still referenced it and calls the
  # mentions "historical", naming this very comment among them. It was not
  # historical. It was the reason the seam was open, and removing the guard left
  # the seam open with nothing behind it.
  #
  # So the previous text's own closing warning came true a third time: "the
  # reason for holding the seam open is only as good as the detector it defers
  # to ... or this comment goes back to being a promise the fleet cannot keep.
  # Twice now it has been exactly that." Twice it was a guard that projected too
  # few keys. This time there is no guard.
  #
  # WHAT CLOSING COSTS, measured 2026-09-30 rather than carried over from the old
  # paragraph, because the population it was measured against is gone. There are
  # THREE python repos left in the fleet (forge-testkit, stellar-core,
  # vault-mcp), not the 24 the old text reasoned about — the rest became Go
  # stars. All three already sit at 3.14 on every writer this template sets, so
  # the conformance the seam was held open to deliver has already arrived. The
  # sections they do not carry are: tool.coverage.run (all three),
  # tool.uv.index / tool.uv.sources (forge-testkit), tool.mypy / tool.pyright /
  # tool.forge_testkit_lint / project.urls (stellar-core), tool.hatch.* (vault-mcp).
  #
  # AND ONE OF THOSE IS THE ARGUMENT BY ITSELF. vault-mcp builds with setuptools
  # — it carries `[tool.setuptools.packages.find]` where this template ships
  # `[tool.hatch.version]` and `[tool.hatch.build.targets.wheel]`. A three-way
  # merge there does not risk losing a key, it risks writing a second, wrong
  # build backend into a working project. The seam was not neutral-but-unguarded;
  # it was actively pointed at a repo it would damage.
  #
  # HOW THE TEMPLATE STILL DELIVERS, the same way the other four do: a change to
  # this file that consumers need gets a VERSIONED `_migrations` entry patching
  # the specific keys. That is what migrations are for — it runs after the diff
  # and it states its intent, where a merge guesses silently. The v0.34.0 entry
  # at the bottom of this file is the worked example, and note that it used "the
  # pyproject seam" to carry `pre-commit>=3.5`; from this version on that kind of
  # delivery is the migration's job, not the merge's.
  #
  # Copier issue #2486 is this exact dilemma and is still OPEN upstream —
  # overwrite eats the project's content, skip withholds the template's
  # improvements, and there is no per-key ownership. Skip plus migrations is the
  # half that fails loudly.
  #
  # IF A DETECTOR COMES BACK, this can be reopened — but on the evidence it
  # should not be reopened just because one exists. The seam's whole history is
  # three rounds of a guard that covered less than the comment claimed.
  - pyproject.toml
  #
  # Everything else that was still merged joins the list. .gitignore because a
  # consumer customises it — a frontend star was measured about to lose nine local
  # lines, among them a `!tools/parity/fixtures/**` negation whose own comment
  # records it fixing a CI outage. cliff.toml and justfile because they are
  # template-owned conformance like their neighbours here. LICENSES/** because a
  # licence text is star-owned once born, like LICENSE above it.
  #
  # .gitignore MUST STAY IN THIS LIST, even though the template's rules then
  # never land through copier's file writer. Cast's conform arm seeds a
  # four-line .gitignore at birth (*.log, .env, .env.*, AGENTS.md), so the file
  # always exists before the first render. Take it out and `copier copy` hits a
  # CONFLICT on the seed and dies non-interactively ("Interactive session
  # required"); add --overwrite and the template clobbers the seed. Measured on
  # go-repo-template 2026-09-11 (#7) — the conflict is copier's, not Go's. The
  # rules reach a repo through the MERGE TASK at the end of `_tasks` instead.
  - .gitignore
  - cliff.toml
  - justfile
  - LICENSES/**
  # foundry conformance: skipped here, clobbered by anneal (C2)
  - .editorconfig
  - .python-version
  - .dockerignore
  # .pre-commit-config.yaml is NOT here because it is GONE (CA F18, 2026-09-19).
  # It was copier's, create AND update, from 2026-08-16 — the one rendered file
  # an update rewrote — and nothing has run it since F15: hooks/pre-commit is
  # `just check` and hooks/pre-push a no-op (foundry-stocks v0.170.0: the
  # pull's gate Job grades a push), tracked one-liners
  # foundry-stocks' copier task renders and points core.hooksPath at. A star
  # born before this keeps its copy until the migration at the foot of this
  # file deletes it (byte-identical to a rendering this template shipped, or it
  # is left alone); a star born after never gets one.
  - .github/**
  - rules/**
  - cosign.pub

project_name:
  type: str
  help: Human-readable project name (e.g. "Widget MCP")

package_name:
  type: str
  help: Importable package name (snake_case)
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

service_name:
  type: str
  help: Distribution / repo / image name (kebab-case); also the console-script when mcp
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

description:
  type: str
  help: One-line project description
  default: A standard Forge Python project.

# WHAT THIS REPO SHIPS (Standalone F4). The container lane — .dockerignore,
# admit, build — hangs off THIS, not off `mcp`. It used to hang off `mcp`, which
# asks a different question and only gave the right answer by luck; this file's
# own help said "Off = plain library/CLI", a distribution shape smuggled through
# a protocol flag.
#
#   star    — ships a container. Everything as before.
#   library — publishes a wheel to the Forgejo PyPI (the publish stub).
#   binary  — ships a release binary through the cast plane.
#
# Default `star` and it is load-bearing here above all: TWENTY-ONE repos are
# stamped from this template and every one of them answers `mcp: true`. Any
# other default turns adding a question into a fleet migration.
variant:
  type: str
  help: "What does this repo ship?"
  choices:
    a container (a star): star
    a published wheel: library
    a release binary (CLI): binary
  default: star

# THE OP-CONTRACT IS NOT A CONTAINER FEATURE, which is why this is its own
# question rather than another read of `variant`. health.py, heartbeat.py and
# observability.py were poured only into a star until 2026-09-25, and the
# measurement that ended it is blunt: this template has TWO subscribers,
# stellar-core and vault-mcp, and BOTH are libraries. The gate was not sparing a
# minority — it withheld the op-contract from every repo that has ever
# subscribed. health.py's own docstring had carried a "Library/CLI star" branch
# the filename gate made unreachable the whole time.
#
# What the old gate was actually reaching for is CONSUMES-vs-PROVIDES, and there
# is exactly one provider. Answer true only in the SDK's own repo: it ships the
# op-contract, so it must not depend on itself — and `pyproject.toml` is this
# template's 3-way MERGE seam rather than a skipped file, so a self-dependency
# would really land.
is_sdk:
  type: bool
  help: "This repo IS the stellar_core SDK — it PROVIDES the op-contract rather than consuming it."
  default: false

# TOOLING-ONLY: this repo's python is the tooling around another language's
# product (hook scripts, probes, a deck's command surface) and it wants the
# fleet's python LANE, not the service skeleton. False (the default) is every
# existing subscriber, unchanged: TWENTY-ONE repos are stamped from this
# template, and any other default turns adding a question into a fleet
# migration. True gates `src/` and `tests/` whole and renders a pyproject that
# declares an environment (and a [build-system], which is what grades the python
# at the canonical width) rather than a distribution.
#
# WHY A QUESTION AND NOT A DELETION. A repo in that position used to render the
# skeleton and delete it by hand, and copier's next `update` put it all back:
# `_skip_if_exists` skips a file that EXISTS, and a deleted one does not. The
# only durable form is a path that is not in the render set at all — which is
# what a filename gate does, and the same mechanism keeps a *rendered-then-
# removed* file from ever being resurrected. It is NOT `variant` (`binary` does
# not gate the skeleton since 2026-09-25) and NOT `is_sdk` (that says "this repo
# IS stellar_core").
#
# tests/ is gated WHOLE, conftest.py and __init__.py included, not just the two
# test files: conftest.py is the autouse no-network guard and imports
# forge_testkit, which the tooling-only pyproject deliberately does not declare.
# A tooling repo owns its own tests/.
tooling_only:
  type: bool
  help: "Python here is tooling around another language's product: lay the lane's config, not the service skeleton."
  default: false

# COMPUTED, NEVER ASKED (`when: false` keeps them out of the answers file, and a
# `copier update` re-derives them from the answers it does have).
#
# `variant: library` MEANS A DISTRIBUTION, NOT A SERVICE (Rob's ruling,
# 2026-10-23, python-repo-template#22568). A wheel is imported, not run, so it is
# born with no service skeleton: no settings, no op-contract, no heartbeat, no
# observability or oneiroi stub. These two names are the whole gate vocabulary
# for the filenames under template/src/, so the rule lives in one place.
#
# service_skeleton: the full born-with set (settings, health, heartbeat,
#   observability, oneiroi). Every variant but a library.
# runs_process: a repo that is started rather than imported needs configuration
#   and a heartbeat. A star, a binary, or a library that is also an MCP server
#   (vault-mcp): server.py reads settings.host/port and main() starts the
#   heartbeat, which reads health. `mcp` alone does not pull in observability or
#   oneiroi: nothing imports them.
service_skeleton:
  type: bool
  default: "{{ variant != 'library' }}"
  when: false

runs_process:
  type: bool
  default: "{{ variant != 'library' or mcp }}"
  when: false

# Where the package lives, for the publish lane. "." for a single-package repo.
package_dir:
  type: str
  help: "Directory holding the package's pyproject.toml (\".\" for the repo root)."
  default: "."
  when: "{{ variant == 'library' }}"

mcp:
  type: bool
  help: "FastMCP service shape (server.py, mcp[cli])."
  default: true

core_backed:
  type: bool
  help: "Builds FROM mnemosyne-core-base (baked core + schema). For constellation stars."
  default: false

# The born-with oneiroi.py emission stub ships to every star by default. A star
# that OUTGROWS the stub into its own oneiroi package (mnemosyne — the dream
# engine lives at src/<pkg>/oneiroi/) must set this false: the regenerated stub
# module shadow-collides with the package on the same import name, and every
# template update re-asserts it (measured 2026-08-06 — the v0.19.0 branch
# re-added the stub beside mnemosyne's package).
oneiroi_stub:
  type: bool
  help: "Ship the born-with oneiroi.py emission stub. False ONLY for a star owning its own oneiroi package."
  default: true
  when: "{{ mcp }}"

core_base_tag:
  type: str
  help: "mnemosyne-core-base IMAGE tag (the baked private schema, e.g. v0.1.0)"
  default: v0.1.0
  when: "{{ mcp and core_backed }}"

core_version:
  type: str
  help: "mnemosyne-core git tag for the uv pin (the core package, e.g. v0.2.0)"
  default: v0.2.0
  when: "{{ mcp and core_backed }}"

# --- Sovereign store (chaos pattern) ----------------------------------------
# A sovereign star OWNS its database (no shared tables across stars): an own-DB
# service on a private network, the app internal-only (no host port), the DB
# password fail-closed from an env secret. Off = the interim shared-corpus shape
# (host port published, external DATABASE_URL).
sovereign_database:
  type: bool
  help: "Constellation star owns its own sovereign database (chaos pattern)?"
  default: false
  # Independent of core_backed: a standalone (non-core-backed) star can still own
  # a sovereign DB (e.g. terpsichore — redpanda-free, but holds terpsichore-db).
  when: "{{ mcp }}"

db_kind:
  type: str
  help: "DB image kind; pgvector for similarity search"
  default: postgres
  choices:
    - postgres
    - pgvector
  when: "{{ mcp and sovereign_database }}"

port:
  type: int
  help: Default streamable-HTTP listen port
  default: 8000
  when: "{{ variant == 'star' and mcp }}"

verb_prefix:
  type: str
  help: "Hades verb namespace (e.g. 'graph'); blank = bare verbs. Rendered into the /infra roster row + hades route table."
  default: ""
  when: "{{ mcp }}"

# --- Mutation gate (Test Hardening C1) -----------------------------------------
# Space-separated source paths whose tests must BITE, not merely run. Blank (the
# default) stamps no mutation.yml at all — deliberately. A mutation gate over a
# module nobody named is either an hours-long full-tree run or a scope that
# matches nothing and reports a vacuous pass; neither is worth having. Declaring
# the module is the act that makes the gate meaningful, so the declaration is
# the trigger.
#
# The stamped stub runs REPORT-ONLY (fail-under defaults to 0). Measure first,
# then raise the threshold in the stub once the honest score is known — binding
# a number nobody has measured just teaches everyone to skip the check.
critical_modules:
  type: str
  help: "Modules whose tests must bite, space-separated (e.g. 'src/pkg/policy.py'). Blank = no mutation gate."
  default: ""

# --- Deploy shape --------------------------------------------------------------
# The `decentralized` question is RETIRED (Flame C4/C6, decoupled): it conflated
# two things recentralization split apart -- a star no longer owns its `/infra`
# (the tofu ROOTS live in rob/infra now, so this template scaffolds NO infra/),
# but every mcp star's build/deploy IS tofu-managed from the foundry core (the F5
# managed-CI plane), so governance is cast from foundry-stocks and laid by gavel,
# not by a copier task.

author_name:
  type: str
  help: Copyright holder / author
  default: Rob Fischer

year:
  type: int
  help: Copyright year
  default: 2026

# --- Star manifest (constellation) ------------------------------------------
# star.toml is NO LONGER stamped by copier (template/star.toml.jinja retired):
# hephaestus's derivation is its sole author (the derived port/image/interface
# keys are authoritative, and copier can't derive a port). These answers remain
# as identity inputs some other template files read; hephaestus re-authors
# star.toml on strike + reconciles it on anneal. The admission gate still
# reads the resulting star.toml at PR time — it runs in the door's lane now,
# not in a workflow file this template pours.

charter:
  type: str
  help: "The star's single-responsibility charter (<= 100 chars) — the SRP gate"
  default: "{{ description }}"

cluster:
  type: str
  help: Constellation cluster this star belongs to
  default: pantheon

star_namespace:
  type: str
  help: "Sovereign namespace this star owns (no shared tables across stars)"
  default: "{{ package_name }}"

substrate_kind:
  type: str
  help: "Deployment substrate kind (container | pod | ...) — the Candidacy litmus"
  default: container

interstellar:
  type: bool
  help: "Produces/consumes Kafka events? Adds async = [\"kafka\"] to the manifest."
  default: false

# Setup tasks. Most are init-only (gated to copy), EXCEPT `uv lock`, which also
# runs on `copier update` so a template pyproject change never leaves a stale
# lock. copy leaves a ready git repo with a synced env + installed hooks.
_tasks:
  # Stamp SPDX/REUSE copyright headers on the star's OWN source that predates the
  # ruff CPY001 requirement (template v0.16.2+), so a reconcile lands green.
  # Inline python, NOT `reuse`: the anneal runs copier under git_env() (which
  # breaks a task's `git ls-files` -> "fatal: not a git repository") AND its uvx
  # cache lacks reuse's charset-normalizer extra (reuse crashes NoEncodingModule)
  # -- reuse was inert in the anneal on both v0.18.2 and v0.18.3. This stamp is
  # git-blind + dependency-free: prepend the fixed header to every .py missing it
  # (after a shebang; skipping .venv/.git/__pycache__), idempotent. UPDATE-only --
  # a fresh strike renders already-stamped template files.
  #
  # A trailing `|| true` used to sit on this task with no stated reason -- it
  # was swallowing EVERY failure mode alike, including a genuine bug in this
  # script. The one real, expected failure is a stray non-UTF-8 .py file
  # somewhere in the star's tree (a fixture, a vendored blob): that one file is
  # now skipped with a printed reason and the sweep continues, instead of either
  # aborting the whole update over an unrelated file or hiding a real crash.
  # Block scalar (not a one-line `-c`) so the per-file try/except can exist at
  # all; no more chr(58)/chr(32) colon-escaping needed either, since a literal
  # block YAML scalar doesn't choke on `: ` the way a plain scalar did.
  - command: |
      python3 - <<'STAMP'
      import pathlib

      H = "# SPDX-FileCopyrightText: 2026 Rob Fischer\n#\n# SPDX-License-Identifier: Apache-2.0\n\n"
      for p in pathlib.Path(".").rglob("*.py"):
          if {".venv", ".git", "__pycache__"} & set(p.parts):
              continue
          try:
              t = p.read_text(encoding="utf-8")
          except (UnicodeDecodeError, OSError) as e:
              print(f"SPDX stamp: skipping {p} ({e})")
              continue
          if "SPDX-FileCopyrightText" in t:
              continue
          cut = t.index("\n") + 1 if t.startswith("#!") else 0
          p.write_text(t[:cut] + H + t[cut:], encoding="utf-8")
      STAMP
    when: "{{ _copier_operation == 'update' }}"
  # Ensure ruff's flake8-copyright notice-rgx ACCEPTS the SPDX form. The stanza
  # ships in pyproject.toml.jinja, but a star that skipped the v0.16.2 template
  # version never received it through the 3-way merge, so CPY001 rejects even a
  # correctly-stamped header. Append it iff absent (idempotent; [0-9]{4} == the
  # template's \d{4}, spelt without a backslash to survive YAML->shell->python).
  - command: python -c "import pathlib; p=pathlib.Path('pyproject.toml'); t=p.read_text(encoding='utf-8'); s='[tool.ruff.lint.flake8-copyright]'; body=s+chr(10)+'notice-rgx = '+chr(39)+'(?i)SPDX-FileCopyrightText:.*[0-9]{4}'+chr(39)+chr(10); p.write_text(t if s in t else t.rstrip()+chr(10)+chr(10)+body, encoding='utf-8')"
    # `not tooling_only`: that render carries no ruff lint tables, only
    # [tool.ruff] line-length (the gate passes its own ruleset), so this would
    # append a lone orphan table to the star's pyproject on every update.
    when: "{{ _copier_operation == 'update' and not tooling_only }}"
  # THE FLAME C4 RELOCATION IS GONE, and so is what it relocated to. It moved
  # `infra/terraform.tfvars` to `{star}.tfvars` at root on update, explaining itself
  # as "rob/infra harvests it as catalog/{star}.tfvars". IT DOES NOT, and has not
  # for weeks — rob/infra's own Makefile records both deaths: the
  # catalog/<star>.tfvars -> stacks/services generator went on 2026-08-08, and
  # OPENTOFU ITSELF went on 2026-09-07 with the roots, fleet-facts/, modules/fleet
  # and the three deploy lanes. Neither catalog/ nor stacks/services/ exists, and
  # infra/.gitignore carries `*.tfvars` so a tfvars was never tracked there at all.
  # Every star deploys from a compose spec in rob/nas01-stacks. Rob's ruling
  # 2026-09-28: tfvars should be gone.
  #
  # This template renders no tfvars of its own (measured: no path under template/
  # matches), so removing the move removes the last live mention. The note is worth
  # more than the task was: the next reader who finds a `{star}.tfvars` at a star's
  # root learns where its consumer went instead of assuming one exists.
  # `--ignore-unmatch` is git rm's OWN no-op-when-absent guard -- that already
  # covers "a migrated star has nothing left to remove"; a trailing `|| true`
  # on top of it added nothing but a way to hide a real `git rm` failure (not a
  # git repo, index lock, permission denied). Removed the file, not the flag.
  # compose.yaml and infra/ are RETIRED by this update — the deploy spec lives in
  # rob/nas01-stacks now, not in a tfvars one task above (see the note there). THE
  # REMOVAL STAYS: retiring the tree is still right, and it is the half of Flame C4
  # that was never about tfvars. Removal is per-path and conditional, because
  # the three obvious spellings are each wrong in a different way -- and all
  # three shipped across these four templates at once, which is what prompted
  # reconciling them:
  #   * `git rm -r --ignore-unmatch` alone is ALL-OR-NOTHING across its
  #     pathspecs. MEASURED (rust-repo-template, 2026-08-18): it exits 1 and
  #     removes NEITHER path when just one of them carries a local
  #     modification, so a star with edits under infra/ hard-fails its whole
  #     copier update.
  #   * `-f` makes the removal real, but FORCE-DELETES those operator edits.
  #   * `|| true` / `|| echo` swallow the refusal, so "the removals land" was
  #     hoped for rather than guaranteed, and nothing said which files survived.
  # So: loop per path, skip one that is absent, remove one that is clean, and
  # REFUSE one carrying local changes -- loudly and by name, without failing the
  # update. Verified on all four paths (absent / clean / dirty / not-a-repo);
  # in the dirty case the clean sibling is still removed and the dirty one named.
  # Spelled with `if`, never `|| exit 0`: a swallow is exactly what this task is
  # being rewritten to stop doing, and the stop-justifications gate scans this
  # file -- it caught the first draft of this very command.
  - command: >-
      bash -c 'if git rev-parse --show-toplevel >/dev/null 2>&1; then
      for p in compose.yaml infra; do if [ -e "$p" ]; then
      if [ -n "$(git status --porcelain -- "$p")" ]; then
      echo "copier: $p has local changes - NOT removed (retired by this update). Review, then: git rm -r $p" >&2;
      else git rm -r --quiet --ignore-unmatch "$p"; fi; fi; done; fi'
    when: "{{ _copier_operation == 'update' and mcp }}"
  - command: git init -q
    when: "{{ _copier_operation == 'copy' }}"
  # ORIGIN IS THE OUREA DOOR (git.notusmi.com), the authoritative git-remote
  # gateway: it serves fetch/pull and gates landings. Forgejo is retired and no
  # longer wired as a remote. GitHub remains the push-mirror target. NOTE the
  # door path takes a BARE repo name (no `rob/` prefix); `git.notusmi.com` is
  # the door's canonical hostname (HTTPS, and it survives an address change,
  # unlike the raw :8215 tailnet address). Idempotent (set-url-or-add where the
  # task is): a re-strike into a reused workdir must converge.
  - command: git remote set-url origin https://git.notusmi.com/{{ service_name }}.git 2>/dev/null || git remote add origin https://git.notusmi.com/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote set-url github https://github.com/robfischer1/{{ service_name }}.git 2>/dev/null || git remote add github https://github.com/robfischer1/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv sync --extra dev
    when: "{{ _copier_operation == 'copy' }}"
  # Re-lock on EVERY operation, including `update`: a template bump that touches
  # pyproject (e.g. a new optional-dependency) otherwise leaves a star with a
  # stale uv.lock that the admission gate's `uv sync --locked` rejects. No `when:`
  # -> runs on update too; `uv lock` is idempotent (no-op when already current).
  # GUARDED on uv's presence: renovate's copier artifact step runs tasks in a
  # container with no uv on PATH, and an exit-127 here made renovate DISCARD the
  # whole rendered update and ship its sentinel edit instead (urania #165,
  # measured 2026-08-05 -- the only update-lane task without a guard). Absent uv
  # degrades to a loud skip: a stale lock reds the PR gate visibly, which beats
  # an update that never lands at all.
  - command: command -v uv >/dev/null 2>&1 && uv lock || echo "uv absent -- lock refresh skipped (the PR gate will catch a stale lock)"
  # The spec-kit override set — the Forge constitution, the four template overrides
  # and the forge-feature workflow — is a COPIER TEMPLATE now (foundry-stocks' root
  # copier.yml rendering speckit/; The Copier Turn C1, 2026-08-27), not a furnace
  # surface. It lands BEFORE `specify init`: `specify init --here --force` leaves
  # every `.specify/` file it finds alone (measured on 0.12.18 with all six
  # pre-seeded) and rewrites only the rendered plan skill, which the re-lay task
  # below restores. A second answers file, `.copier-answers.speckit.yml`, so it
  # never collides with this template's own. `--overwrite` so a headless strike
  # never prompts; `--defaults` because the template asks nothing. Latest
  # foundry-stocks tag by default — every merge there is tagged, so no pin here.
  # --trust IS LOAD-BEARING, NOT TIDINESS (measured, copier 9.17.2, 2026-09-09).
  # foundry-stocks' root copier.yml now declares `_tasks` — it is the delivery
  # vehicle for Continuous Accountability F4's pre-push gate hook, and a copier
  # task is the only thing in the fleet that runs on a WORKSTATION checkout on
  # both a strike and a re-lay (renovate's `copier update` runs in its own
  # container, and `.git/hooks` never travels through a PR). Copier REFUSES an
  # untrusted template that declares tasks outright — `Template uses potentially
  # unsafe feature: tasks`, exit 4, NOTHING RENDERED — it does not skip the tasks
  # and carry on. So without this flag the two calls below stop delivering the
  # spec-kit override set entirely, and a strike dies here. Trust means the
  # template's own tasks run: foundry-stocks is ours, on the Ourea door, which is
  # the same trust renovate's copier manager already grants (renovate-config
  # config.js, `copier: { ignoreScripts: false }`).
  - command: uvx --from copier==9.17.2 copier copy --defaults --overwrite --trust https://git.notusmi.com/foundry/foundry-stocks.git .
    when: "{{ _copier_operation == 'copy' }}"
  # Spec-Driven Development scaffold. spec-kit init lays .specify/ (ps scripts +
  # core templates) and the claude speckit-* skills. NOTE: spec-kit no longer
  # git-inits (git is opt-in since 0.10.0) — the `git init -q` above is load-bearing.
  # `specify` must be on PATH. Runs AFTER the override template above: it keeps the
  # five `.specify/` override files it finds and rewrites `speckit-plan/SKILL.md` —
  # from core or from the override, depending on state the strike does not control
  # (both measured on 0.12.18) — which is why the re-lay task follows.
  - command: specify init --here --force --integration claude --script ps --ignore-agent-tools
    when: "{{ _copier_operation == 'copy' }}"
  # Keep spec-kit's agent-context (the <!-- SPECKIT --> markers) from writing a repo
  # CLAUDE.md: the repo carries none, and its sessions load the ~/Forge
  # CLAUDE.md/AGENTS.md that gavel lays above it.
  # Some spec-kit builds ship the extension already-uninstalled (`disable` then
  # errors "not installed" and would fail the whole strike); a blanket `|| true`
  # used to swallow THAT case, but it just as quietly swallowed a real `disable`
  # failure on a build where the extension IS present. Ask `list` first (always
  # exits 0, present-or-not) and only call `disable` when agent-context actually
  # shows up in it -- a real failure from that call now surfaces and rolls the
  # strike back, same as every other task here.
  # spec-kit's agent-context extension is NOT installed by default, so a bare
  # `specify extension disable agent-context` fails ("Extension 'agent-context'
  # is not installed") every single time this task runs -- the `|| true` and
  # `|| echo` spellings were masking a call that never once succeeded, not an
  # occasional idempotency edge. Guard on presence instead.
  #
  # NOT `specify extension list 2>/dev/null | grep -q`: that spelling discards
  # the list command's OWN failure, so a broken `.specify/` (from the task just
  # above) reads as "not installed" and the strike continues on a repo that
  # never got scaffolded. Capturing the output and checking its exit code keeps
  # that failure loud. Verified all three paths: not-a-project -> exit 1 (loud),
  # installed-but-absent -> exit 0 (clean skip), installed-and-enabled ->
  # disabled, exit 0.
  - command: >-
      bash -c 'out="$(specify extension list)" || exit 1;
      if echo "$out" | grep -q agent-context; then specify extension disable agent-context; fi'
    when: "{{ _copier_operation == 'copy' }}"
  # Re-lay the override plan skill. `specify init` just rewrote
  # `.claude/skills/speckit-plan/SKILL.md`; the override template lists it under
  # `_skip_if_exists`, and skip beats `--overwrite` in copier's conflict resolution,
  # so a second copy cannot replace it while it exists — remove it, and `recopy`
  # recreates the absent skip file from the recorded template version. `recopy`,
  # never `update`: `.specify/` and `.claude/` are gitignored, and copier's update
  # replays an index-based diff that deletes what it cannot see (measured).
  - command: rm -f .claude/skills/speckit-plan/SKILL.md && uvx --from copier==9.17.2 copier recopy --defaults --overwrite --trust -a .copier-answers.speckit.yml
    when: "{{ _copier_operation == 'copy' }}"
  # NOTE: a star no longer scaffolds `/infra` (Flame C4). This used to add "the tofu
  # roots live in rob/infra, which harvests the sovereign shape from the star's
  # {star}.tfvars" — BOTH HALVES ARE NOW FALSE. OpenTofu left rob/infra on
  # 2026-09-07 and the harvest died a month earlier; deploy is a compose spec in
  # rob/nas01-stacks. The scaffolding claim is the part that still holds.
  # copier needs no docker or Forgejo creds to stamp a star.
  # Verify the plan-command override resolves as the project-tier winner.
  - command: specify preset resolve speckit.plan
    when: "{{ _copier_operation == 'copy' }}"
  # `preset resolve` reports the project override even when the RENDERED skill is
  # spec-kit's core one (measured 0.12.18) — check the file that actually runs.
  - command: grep -q 'authoritative design substrate' .claude/skills/speckit-plan/SKILL.md
    when: "{{ _copier_operation == 'copy' }}"
  # THE .gitignore MERGE — go-repo-template#7, ported (hephaestus#8150). Runs
  # LAST, after every other task has laid down the surfaces these rules are
  # about (.specify/ from `specify init`, .claude/ from spec-kit).
  #
  # `.gitignore` has two writers and neither is wrong: conform's birth seed, and
  # this template's rules. `_skip_if_exists` lets the seed win (see the note on
  # the list above), so without this task a cast-born star never gets the rules
  # — measured on glaucus and proteus, the first two stars born through cast,
  # which each staged ~20 .specify files on their first commit.
  #
  # A managed block composes them. Everything OUTSIDE the markers is the repo's
  # and is never read or moved; everything inside is this template's and is
  # replaced wholesale, so a rules change reaches a star as a clean diff.
  # `_copier_conf.src_path` is the template clone, so the block is always the
  # rules this version ships — no second copy to drift.
  #
  # A SEEDLESS copy (a plain `copier copy` with no conform seed) renders
  # template/.gitignore itself, because `_skip_if_exists` only skips a file that
  # is already there. The whole file is then this template's rules, so it
  # becomes the block instead of gaining a second copy of itself. A file already
  # doubled that way loses the copy above its block on the next run
  # (go-repo-template#9311). Cast always seeds, so no cast-born star was hit.
  #
  # CHANGING gitignore.rules? Mirror it into template/.gitignore
  # (`pytest test_gitignore_sync.py` fails on drift). This task carries it to
  # NEW stars only. Born stars need a bumped `_migrations` entry — copy the
  # newest gitignore one (v0.39.1) at the bottom of this file and change its version.
  - command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", managed-block, .gitignore, --rules, "{{ _copier_conf.src_path }}/gitignore.rules", --name, python-repo-template]
    when: "{{ _copier_operation == 'copy' }}"

# ONE-OFF SWEEP for v0.20.2: carry the fixed release recipe to stars already born.
#
# `justfile` is in `_skip_if_exists` above, so `copier update` will not deliver
# this — a versioned migration is the mechanism for exactly that case. It runs at
# the `after` stage, once copier has reapplied its diff, which is why a `_task`
# cannot do it: tasks run BEFORE that.
#
# The recipe shipped two defects (rob/python-repo-template#3143): it tagged
# without moving the version literal, and its own documented invocation
# `just release EXECUTE=1` silently dry-ran, because just reads NAME=value as a
# variable assignment and the recipe PARAMETER kept its "0" default.
#
# TWO ACCEPTED PRIOR SHAPES, not one. v0.20.1 fixed the recipe but left one
# header line still saying "pass EXECUTE=1" — contradicting the corrected note
# below it in the same block. A star that already updated to v0.20.1 therefore
# holds neither the original nor the final text, and a single-variant sweep
# would skip it and report it as hand-modified. Both are matched; both land on
# the same corrected block.
#
# EXACT-MATCH, NEVER A GUESS. A star whose recipe matches neither shape is
# REPORTED and LEFT ALONE — this file's standard is that "a merge silently
# guesses", and clobbering a local edit would be that sin in a new coat.
#
# EVERY ENTRY BELOW RUNS ONE COMMITTED COMMAND, AS ARGV (Rob's atom law: no
# inline code in YAML). That command is tools/copier_migrate.py, read from the
# template clone (`_copier_conf.src_path`) at the version being updated to, and
# tested by tools/test_copier_migrate*.py in this repo's gate. The same file is
# vendored, byte for byte, in go-, rust- and frontend-repo-template (a template
# cannot import across repos); test_copier_migrate_core.py pins its sha256, so a
# lone edit fails there. Each migration's
# payload is a JSON file under migrations/ — data, not code — so blocks carrying
# `{{EXECUTE}}` or `{{just_executable()}}` need no base64 armour: Jinja renders
# the argv, never the payload. Until 2026-10-24 each entry was an inline
# `python3 - <<'SWEEP'` heredoc with base64 blocks; the specs here are those
# blocks, decoded byte for byte. New migration: add a spec, add one argv entry.
_migrations:

  # CA F18, 2026-09-19 — PRE-COMMIT LEAVES THE STARS ALREADY BORN. Nothing has
  # run .pre-commit-config.yaml since F15 (hooks/pre-commit is `just check`,
  # hooks/pre-push is `just gate`, both on the engine), and Rob (2026-09-19):
  # "I don't want any of this running locally anymore." The template stopped
  # rendering the file in this version; copier never deletes a star's file, so
  # this is the delete — GATED ON BYTE-IDENTITY: the file goes only when its
  # sha256 is one the four templates ever shipped (every rendering in go-,
  # rust-, python- and frontend-repo-template's history, 83 in all; the file
  # carried no jinja, so a rendering is a template version, byte for byte).
  # MEASURED 2026-09-19 across origin/main of the fleet: 43 stars carry a
  # known rendering and lose the file here; 22 trees carry an edited one or
  # are not stars and are LEFT ALONE with a note — an edit somebody made is
  # theirs to retire. The deletion lands as an unstaged change in whoever's
  # tree runs the update, exactly like every other migration here.
  #
  # AND `just lint` BECOMES THE COMMIT STAGE. The recipe was `uv run pre-commit
  # run …` (two shapes, the v0.25.13 sweep's PRIOR and NEW below); it is
  # `lint: check` now — the same engine call the commit hook makes. justfile is
  # `_skip_if_exists`, so this is the sweep that carries it, idempotent as the
  # others: a justfile already on the new recipe, or on no shape this template
  # shipped, is left alone.
  #
  # `pre-commit>=3.5` leaves the dev deps through the pyproject seam on this
  # update; the `uv lock` task above refreshes the lock in the same run.
  - version: v0.34.0
    when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", retire, .pre-commit-config.yaml, --spec, "{{ _copier_conf.src_path }}/migrations/v0.34.0-pre-commit.json"]
  - version: v0.34.0
    when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", swap, justfile, --spec, "{{ _copier_conf.src_path }}/migrations/v0.34.0-lint.json"]

  # ONE-OFF SWEEP for v0.25.13: carry the untracked-file lint fix to stars
  # already born. Same mechanism, same reasons, same safety rules as the
  # v0.20.2 sweep below — read that block first; this one only restates what
  # differs.
  #
  # ⚑ WHY A MIGRATION AND NOT JUST THE TEMPLATE EDIT. `justfile` is in
  # `_skip_if_exists`, so the fix in #86 (v0.25.11) reaches NEWLY GENERATED
  # repos ONLY. `copier update` does not deliver it and cannot — measured
  # 2026-08-20 on mnemosyne, which updated v0.25.4 -> v0.25.11, took the
  # .pre-commit-config.yaml changes, and did NOT take the justfile. The fix had
  # to be hand-carried there. eris still carries the defect (v0.25.3), and any
  # Python star born before #86 landed would too.
  #
  # DRY-RUN AGAINST THE REAL CONSUMERS before this was written, not after:
  #   eris       v0.25.3   -> sweeps, file changes
  #   mnemosyne  v0.25.11  -> no-op, already carries the fix by hand
  #   vault-mcp            -> NOT AFFECTED. It has no justfile at all; its
  #                           --all-files runs in CI, where everything is
  #                           committed by definition, so there is no untracked
  #                           file to be blind to. The blind spot needs a LOCAL
  #                           gate. An earlier note of mine claimed otherwise.
  #
  # THE DEFECT IT CARRIES. `pre-commit run --all-files` means every file GIT
  # KNOWS ABOUT, so a newly written module is invisible to lint until it is
  # staged: `just check` passes green and the commit hook then fails on the
  # same file for findings the gate just said were not there. It bit mnemosyne
  # three times in two days — five ruff findings in one new module, a TC003 in
  # a new eris test, and a D107 in a new module during a later session, all
  # through a green gate.
  #
  # ONE PRIOR SHAPE, not two. The whole history of this recipe is two versions:
  # the original four-liner, byte-identical across 0818145..2c49000, and the
  # fixed block from 715df90. Verified by hashing the block at every commit
  # that touched template/justfile.
  #
  # IDEMPOTENT, which matters more here than for v0.20.2: mnemosyne already
  # carries the fix by hand, so this MUST no-op there rather than double-apply.
  # The swap verb's "new block already present" guard is what makes that true.
  #
  # The payload (migrations/v0.25.13-lint.json) is the `# Format + lint` ..
  # `# BOTH type checkers` slice of template/justfile at each shipped ref.
  - version: v0.25.13
    when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", swap, justfile, --spec, "{{ _copier_conf.src_path }}/migrations/v0.25.13-lint.json"]
  - version: v0.20.2
    when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", swap, justfile, --spec, "{{ _copier_conf.src_path }}/migrations/v0.20.2-release.json"]

  # CARRY THE .gitignore RULES TO STARS ALREADY BORN — go-repo-template#7,
  # ported. The task above fires on `copy` only, and `.gitignore` is in
  # `_skip_if_exists`, so `copier update` will not deliver the rules either; a
  # versioned `after`-stage migration is this file's mechanism for a skipped
  # path, same as the justfile sweeps above. Same payload as the copy task,
  # deliberately — one merge, two entry points.
  - version: v0.32.0
    when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", managed-block, .gitignore, --rules, "{{ _copier_conf.src_path }}/gitignore.rules", --name, python-repo-template, --note, ".specify/ or .claude/ already TRACKED? a rule does not evict", --note, "what is in the index - `git rm -r --cached .specify .claude`"]

  # RE-DELIVER THE .gitignore BLOCK — the v0.32.0 migration only reaches stars born
  # before v0.32.0. F5a then changed the rules (`*.log` added where it was missing;
  # a line reworded) without a new migration, so every star already past v0.32.0 kept
  # the old block. Same payload as the v0.32.0 entry, deliberately: the merge replaces
  # the managed block in place and reports "already current" when nothing changed.
  - version: v0.39.1
    when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", managed-block, .gitignore, --rules, "{{ _copier_conf.src_path }}/gitignore.rules", --name, python-repo-template, --note, ".specify/ or .claude/ already TRACKED? a rule does not evict", --note, "what is in the index - `git rm -r --cached .specify .claude`"]

  # CARRY THE CLUSTER `test` RECIPE TO STARS ALREADY BORN (python-repo-template#46).
  #
  # #46 moved the template's `test` onto `_dev test` (dev.just, `import?`), for
  # new stars only: justfile is `_skip_if_exists`. This is the delivery. The
  # recipe is replaced only if the star still carries the shipped block byte for
  # byte (its own [doc]/[positional-arguments] lines go with it); a recipe the
  # star edited is NAMED and LEFT ALONE. (No `just --list` re-parse, unlike the
  # go sweep: exact match swaps a shipped block for a shipped block.)
  #
  # GATED ON dev.just AND VERSIONLESS ON PURPOSE (the go template's DEV_SWEEP
  # reasoning): copier runs a versioned migration only on an update that crosses
  # its version, so a star updated before speckit laid dev.just would skip it for
  # good. With no `version:` it runs at every update and stands down once the
  # justfile imports dev.just. It refuses a justfile with its own `_dev`, and
  # one without `import 'stages.just'` (the anchor the import goes after).
  # The payload is migrations/dev-recipes.json; tools/test_copier_migrate.py
  # pins it to template/justfile, so the two cannot drift.
  - when: "{{ _stage == 'after' }}"
    command: [python3, "{{ _copier_conf.src_path }}/tools/copier_migrate.py", recipes, justfile, --spec, "{{ _copier_conf.src_path }}/migrations/dev-recipes.json"]
