# Python-repo copier template — stamps a standard Forge Python project.
# `mcp = true`  -> a container-ready FastMCP service (the formalized vault-mcp
#                 shape: server.py, mcp[cli], Dockerfile/compose, deploy gate).
# `mcp = false` -> a plain Python library / CLI: the same QA/CI/lint spine,
#                 no service machinery. Realizes the service-repo standard:
# furnace/docs/service-repo-standard.md. copier lays the pure-code body; the
# final `_task` runs `furnace ignite` to pour the governance kit (the `code-repo`
# furnace kit) — copier owns repo creation, furnace owns the `.claude/` layer.

_subdirectory: template
_min_copier_version: "9.0.0"

# `_skip_if_exists` = every rendered path EXCEPT the two seams (pyproject.toml +
# .gitignore). It scopes copier to what copier is good at: create-if-absent for
# the star-owned stubs (README/docs/source) on birth, and a 3-way merge for the
# seams on update — nothing else. A star builds out its README and src after
# birth; a `copier update`/anneal must NOT 3-way-merge them (the fleet-wide
# README conflict that failed the anneal arm closed). The foundry conformance
# files (.forgejo, pre-commit, editorconfig, …) are skipped here so update never
# conflicts them; anneal CLOBBERS them from a fresh render (Flame C2) — a
# conformance surface is enforced, not merged. Paths are RENDERED destination
# paths (template/ stripped by _subdirectory, .jinja stripped). Kept in sync
# with hephaestus `ownership.py`'s non-seam set (Flame C1).
_skip_if_exists:
  # star-owned: rendered once at birth, then the star's
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - SECURITY.md
  - src/**
  - tests/**
  # THE SEAM NARROWED, NOT CLOSED — and pyproject.toml is deliberately ABSENT
  # from this list, alone among the five templates.
  #
  # The other four closed their manifest seam outright: go.mod and Cargo.toml had
  # been touched by their template exactly ONCE each (the commit that created
  # them), and package.json 10 times with a thin claim, so skipping cost nothing.
  # MEASURED HERE, the answer inverts: template/pyproject.toml.jinja has 23
  # commits, `[project]` changed in 17 of them and `[tool.*]` in 16 — uv 8,
  # mypy 4, ruff 2, pytest / coverage / hatch / pyright / forge_testkit_lint 1
  # each. This template delivers real, ongoing conformance through that file, and
  # `[tool.hatch]` and most of `[tool.uv]` CANNOT live anywhere else — they are
  # build-backend and resolver config that pyproject.toml owns by definition.
  #
  # So skipping it would withhold sixteen tool-config deliveries' worth of
  # conformance to prevent a clobber, which is trading one silent failure for
  # another. pyproject stays a merge seam, and is protected by DETECTION instead:
  # foundry-stocks' manifest guard refuses a copier-update PR that regresses a
  # star-owned field. Uniform closure would have been wrong for exactly one of
  # the five templates, and this is it.
  #
  # Everything else that was still merged joins the list. .gitignore because a
  # consumer customises it — a frontend star was measured about to lose nine local
  # lines, among them a `!tools/parity/fixtures/**` negation whose own comment
  # records it fixing a CI outage. cliff.toml and justfile because they are
  # template-owned conformance like their neighbours here. LICENSES/** because a
  # licence text is star-owned once born, like LICENSE above it.
  - .gitignore
  - cliff.toml
  - justfile
  - LICENSES/**
  # foundry conformance: skipped here, clobbered by anneal (C2)
  - .editorconfig
  - .python-version
  - .dockerignore
  # .pre-commit-config.yaml is NOT here: copier OWNS it, create AND update.
  # It sat in this list from 2026-07-23 (Flame C1, "copier owns create-if-absent
  # + the seams") until 2026-08-16, and in that window nothing owned the file at
  # all — copier skipped it, furnace stopped pouring the scaffold surface, and
  # hephaestus's `anneal` (the last thing that rewrote one) was removed in the
  # rewrite. MEASURED 2026-08-16: of 18 in-sync python repos, ZERO were
  # byte-identical to this template; the fleet had drifted 45-176 lines apiece
  # with no mechanism able to see it, and 8 repos still carried a commit-msg
  # hook retired from here on 2026-08-04.
  - .forgejo/**
  - .github/**
  - rules/**
  - cosign.pub

project_name:
  type: str
  help: Human-readable project name (e.g. "Widget MCP")

package_name:
  type: str
  help: Importable package name (snake_case)
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

service_name:
  type: str
  help: Distribution / repo / image name (kebab-case); also the console-script when mcp
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

description:
  type: str
  help: One-line project description
  default: A standard Forge Python project.

# WHAT THIS REPO SHIPS (Standalone F4). The container lane — .dockerignore,
# admit, build — hangs off THIS, not off `mcp`. It used to hang off `mcp`, which
# asks a different question and only gave the right answer by luck; this file's
# own help said "Off = plain library/CLI", a distribution shape smuggled through
# a protocol flag.
#
#   star    — ships a container. Everything as before.
#   library — publishes a wheel to the Forgejo PyPI (the publish stub).
#   binary  — ships a release binary through the cast plane.
#
# Default `star` and it is load-bearing here above all: TWENTY-ONE repos are
# stamped from this template and every one of them answers `mcp: true`. Any
# other default turns adding a question into a fleet migration.
variant:
  type: str
  help: "What does this repo ship?"
  choices:
    a container (a star): star
    a published wheel: library
    a release binary (CLI): binary
  default: star

# Where the package lives, for the publish lane. "." for a single-package repo.
package_dir:
  type: str
  help: "Directory holding the package's pyproject.toml (\".\" for the repo root)."
  default: "."
  when: "{{ variant == 'library' }}"

mcp:
  type: bool
  help: "FastMCP service shape (server.py, mcp[cli])."
  default: true

core_backed:
  type: bool
  help: "Builds FROM mnemosyne-core-base (baked core + schema). For constellation stars."
  default: false

# The born-with oneiroi.py emission stub ships to every star by default. A star
# that OUTGROWS the stub into its own oneiroi package (mnemosyne — the dream
# engine lives at src/<pkg>/oneiroi/) must set this false: the regenerated stub
# module shadow-collides with the package on the same import name, and every
# template update re-asserts it (measured 2026-08-06 — the v0.19.0 branch
# re-added the stub beside mnemosyne's package).
oneiroi_stub:
  type: bool
  help: "Ship the born-with oneiroi.py emission stub. False ONLY for a star owning its own oneiroi package."
  default: true
  when: "{{ mcp }}"

core_base_tag:
  type: str
  help: "mnemosyne-core-base IMAGE tag (the baked private schema, e.g. v0.1.0)"
  default: v0.1.0
  when: "{{ mcp and core_backed }}"

core_version:
  type: str
  help: "mnemosyne-core git tag for the uv pin (the core package, e.g. v0.2.0)"
  default: v0.2.0
  when: "{{ mcp and core_backed }}"

# --- Sovereign store (chaos pattern) ----------------------------------------
# A sovereign star OWNS its database (no shared tables across stars): an own-DB
# service on a private network, the app internal-only (no host port), the DB
# password fail-closed from an env secret. Off = the interim shared-corpus shape
# (host port published, external DATABASE_URL).
sovereign_database:
  type: bool
  help: "Constellation star owns its own sovereign database (chaos pattern)?"
  default: false
  # Independent of core_backed: a standalone (non-core-backed) star can still own
  # a sovereign DB (e.g. terpsichore — pontus-free, but holds terpsichore-db).
  when: "{{ mcp }}"

db_kind:
  type: str
  help: "DB image kind; pgvector for similarity search"
  default: postgres
  choices:
    - postgres
    - pgvector
  when: "{{ mcp and sovereign_database }}"

port:
  type: int
  help: Default streamable-HTTP listen port
  default: 8000
  when: "{{ variant == 'star' and mcp }}"

verb_prefix:
  type: str
  help: "Hades verb namespace (e.g. 'graph'); blank = bare verbs. Rendered into the /infra roster row + hades route table."
  default: ""
  when: "{{ mcp }}"

# --- Mutation gate (Test Hardening C1) -----------------------------------------
# Space-separated source paths whose tests must BITE, not merely run. Blank (the
# default) stamps no mutation.yml at all — deliberately. A mutation gate over a
# module nobody named is either an hours-long full-tree run or a scope that
# matches nothing and reports a vacuous pass; neither is worth having. Declaring
# the module is the act that makes the gate meaningful, so the declaration is
# the trigger.
#
# The stamped stub runs REPORT-ONLY (fail-under defaults to 0). Measure first,
# then raise the threshold in the stub once the honest score is known — binding
# a number nobody has measured just teaches everyone to skip the check.
critical_modules:
  type: str
  help: "Modules whose tests must bite, space-separated (e.g. 'src/pkg/policy.py'). Blank = no mutation gate."
  default: ""

# --- Deploy shape --------------------------------------------------------------
# The `decentralized` question is RETIRED (Flame C4/C6, decoupled): it conflated
# two things recentralization split apart -- a star no longer owns its `/infra`
# (the tofu ROOTS live in rob/infra now, so this template scaffolds NO infra/),
# but every mcp star's build/deploy IS tofu-managed from the foundry core (the F5
# managed-CI plane), so furnace pours only the PR gates (code-repo-sdd-
# decentralized). That kit choice now rides `mcp` alone (see the ignite _task).

author_name:
  type: str
  help: Copyright holder / author
  default: Rob Fischer

year:
  type: int
  help: Copyright year
  default: 2026

# --- Star manifest (constellation) ------------------------------------------
# star.toml is NO LONGER stamped by copier (template/star.toml.jinja retired):
# hephaestus's derivation is its sole author (the derived port/image/interface
# keys are authoritative, and copier can't derive a port). These answers remain
# as identity inputs some other template files read; hephaestus re-authors
# star.toml on strike + reconciles it on anneal. The admission gate
# (.forgejo/workflows/admit.yml) still reads the resulting star.toml at PR time.

charter:
  type: str
  help: "The star's single-responsibility charter (<= 100 chars) — the SRP gate"
  default: "{{ description }}"

cluster:
  type: str
  help: Constellation cluster this star belongs to
  default: pantheon

star_namespace:
  type: str
  help: "Sovereign namespace this star owns (no shared tables across stars)"
  default: "{{ package_name }}"

substrate_kind:
  type: str
  help: "Deployment substrate kind (container | pod | ...) — the Candidacy litmus"
  default: container

interstellar:
  type: bool
  help: "Produces/consumes Kafka events? Adds async = [\"kafka\"] to the manifest."
  default: false

# Setup tasks. Most are init-only (gated to copy), EXCEPT `uv lock`, which also
# runs on `copier update` so a template pyproject change never leaves a stale
# lock. copy leaves a ready git repo with a synced env + installed hooks.
_tasks:
  # Normalize the copier-generated answers file to end with exactly one newline.
  # Belt-and-braces behind the `|trim` in the answers-file jinja: the raw render
  # used to end with TWO newlines (to_nice_yaml's own + the template's final one),
  # which fails the end-of-file-fixer pre-commit hook -> a red CI gate on the
  # first PR of every stamped repo. The jinja now renders exactly one; this task
  # keeps a task-skipping/untrusted render from ever regressing a trusted one.
  # Ungated: runs on BOTH copy and update.
  - command: python -c "import pathlib; p=pathlib.Path('.copier-answers.yml'); p.write_text(p.read_text(encoding='utf-8').rstrip()+chr(10), encoding='utf-8')"
  # Stamp SPDX/REUSE copyright headers on the star's OWN source that predates the
  # ruff CPY001 requirement (template v0.16.2+), so a reconcile lands green.
  # Inline python, NOT `reuse`: the anneal runs copier under git_env() (which
  # breaks a task's `git ls-files` -> "fatal: not a git repository") AND its uvx
  # cache lacks reuse's charset-normalizer extra (reuse crashes NoEncodingModule)
  # -- reuse was inert in the anneal on both v0.18.2 and v0.18.3. This stamp is
  # git-blind + dependency-free: prepend the fixed header to every .py missing it
  # (after a shebang; skipping .venv/.git/__pycache__), idempotent. UPDATE-only --
  # a fresh strike renders already-stamped template files.
  #
  # A trailing `|| true` used to sit on this task with no stated reason -- it
  # was swallowing EVERY failure mode alike, including a genuine bug in this
  # script. The one real, expected failure is a stray non-UTF-8 .py file
  # somewhere in the star's tree (a fixture, a vendored blob): that one file is
  # now skipped with a printed reason and the sweep continues, instead of either
  # aborting the whole update over an unrelated file or hiding a real crash.
  # Block scalar (not a one-line `-c`) so the per-file try/except can exist at
  # all; no more chr(58)/chr(32) colon-escaping needed either, since a literal
  # block YAML scalar doesn't choke on `: ` the way a plain scalar did.
  - command: |
      python3 - <<'STAMP'
      import pathlib

      H = "# SPDX-FileCopyrightText: 2026 Rob Fischer\n#\n# SPDX-License-Identifier: Apache-2.0\n\n"
      for p in pathlib.Path(".").rglob("*.py"):
          if {".venv", ".git", "__pycache__"} & set(p.parts):
              continue
          try:
              t = p.read_text(encoding="utf-8")
          except (UnicodeDecodeError, OSError) as e:
              print(f"SPDX stamp: skipping {p} ({e})")
              continue
          if "SPDX-FileCopyrightText" in t:
              continue
          cut = t.index("\n") + 1 if t.startswith("#!") else 0
          p.write_text(t[:cut] + H + t[cut:], encoding="utf-8")
      STAMP
    when: "{{ _copier_operation == 'update' }}"
  # Ensure ruff's flake8-copyright notice-rgx ACCEPTS the SPDX form. The stanza
  # ships in pyproject.toml.jinja, but a star that skipped the v0.16.2 template
  # version never received it through the 3-way merge, so CPY001 rejects even a
  # correctly-stamped header. Append it iff absent (idempotent; [0-9]{4} == the
  # template's \d{4}, spelt without a backslash to survive YAML->shell->python).
  - command: python -c "import pathlib; p=pathlib.Path('pyproject.toml'); t=p.read_text(encoding='utf-8'); s='[tool.ruff.lint.flake8-copyright]'; body=s+chr(10)+'notice-rgx = '+chr(39)+'(?i)SPDX-FileCopyrightText:.*[0-9]{4}'+chr(39)+chr(10); p.write_text(t if s in t else t.rstrip()+chr(10)+chr(10)+body, encoding='utf-8')"
    when: "{{ _copier_operation == 'update' }}"
  # Flame C4 -- migrate a pre-recentralization star. Recentralization moved the
  # tofu ROOTS to rob/infra, so the star-local `infra/` tree + `compose.yaml` are
  # dead weight; the ONE thing the star still owns -- its sovereign spec -- is
  # RELOCATED to `{star}.tfvars` at root (rob/infra harvests it as
  # catalog/{star}.tfvars). MOVE before REMOVE so the operator's env survives.
  # Update-only (a fresh copy has neither); idempotent via the explicit `if`
  # existence guard below, not a blanket `|| true` -- a migrated star (file
  # already gone) still no-ops, but a REAL `git mv` failure (dest exists,
  # detached HEAD, permission denied) now fails the strike instead of being
  # swallowed alongside the expected case.
  - command: if test -f infra/terraform.tfvars; then git mv -f infra/terraform.tfvars {{ service_name }}.tfvars; fi
    when: "{{ _copier_operation == 'update' and mcp }}"
  # `--ignore-unmatch` is git rm's OWN no-op-when-absent guard -- that already
  # covers "a migrated star has nothing left to remove"; a trailing `|| true`
  # on top of it added nothing but a way to hide a real `git rm` failure (not a
  # git repo, index lock, permission denied). Removed the file, not the flag.
  # compose.yaml and infra/ are RETIRED by this update (the deploy spec moved to
  # <name>.tfvars, one task above). Removal is per-path and conditional, because
  # the three obvious spellings are each wrong in a different way -- and all
  # three shipped across these four templates at once, which is what prompted
  # reconciling them:
  #   * `git rm -r --ignore-unmatch` alone is ALL-OR-NOTHING across its
  #     pathspecs. MEASURED (rust-repo-template, 2026-08-18): it exits 1 and
  #     removes NEITHER path when just one of them carries a local
  #     modification, so a star with edits under infra/ hard-fails its whole
  #     copier update.
  #   * `-f` makes the removal real, but FORCE-DELETES those operator edits.
  #   * `|| true` / `|| echo` swallow the refusal, so "the removals land" was
  #     hoped for rather than guaranteed, and nothing said which files survived.
  # So: loop per path, skip one that is absent, remove one that is clean, and
  # REFUSE one carrying local changes -- loudly and by name, without failing the
  # update. Verified on all four paths (absent / clean / dirty / not-a-repo);
  # in the dirty case the clean sibling is still removed and the dirty one named.
  # Spelled with `if`, never `|| exit 0`: a swallow is exactly what this task is
  # being rewritten to stop doing, and the stop-justifications gate scans this
  # file -- it caught the first draft of this very command.
  - command: >-
      bash -c 'if git rev-parse --show-toplevel >/dev/null 2>&1; then
      for p in compose.yaml infra; do if [ -e "$p" ]; then
      if [ -n "$(git status --porcelain -- "$p")" ]; then
      echo "copier: $p has local changes - NOT removed (retired by this update). Review, then: git rm -r $p" >&2;
      else git rm -r --quiet --ignore-unmatch "$p"; fi; fi; done; fi'
    when: "{{ _copier_operation == 'update' and mcp }}"
  - command: git init -q
    when: "{{ _copier_operation == 'copy' }}"
  # Remotes follow the post-F27 fleet convention: ORIGIN IS THE OUREA DOOR, not
  # Forgejo. The door is the authoritative git-remote gateway (it serves real
  # fetch/pull since 2026-07-19 and gates landings via Serves); Forgejo stays as
  # a FETCH-ONLY remote with its push side disabled by the `no_push_f27`
  # sentinel, so a stray `git push forgejo` fails loudly instead of bypassing the
  # gate. GitHub remains the push-mirror target.
  # NOTE the door path takes a BARE repo name (no `rob/` prefix), unlike Forgejo.
  # `git.notusmi.com` is the door's canonical hostname (A -> 100.93.64.106, the
  # same host as the :8215 tailnet address, serving identical refs). Prefer it
  # over the raw IP:port: it is HTTPS rather than plaintext, it survives an
  # address change, and it is already the fleet's public git face.
  # The remote repo must still be created on Forgejo first (push-to-create is
  # disabled instance-wide); these only wire the local remotes to the convention.
  # Idempotent (set-url-or-add): a re-strike into a reused workdir must converge,
  # not die on "remote origin already exists" — the strike contract is idempotent.
  - command: git remote set-url origin https://git.notusmi.com/{{ service_name }}.git 2>/dev/null || git remote add origin https://git.notusmi.com/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote set-url forgejo https://forgejo.notusmi.com/rob/{{ service_name }}.git 2>/dev/null || git remote add forgejo https://forgejo.notusmi.com/rob/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote set-url --push forgejo no_push_f27
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote set-url github https://github.com/robfischer1/{{ service_name }}.git 2>/dev/null || git remote add github https://github.com/robfischer1/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv sync --extra dev
    when: "{{ _copier_operation == 'copy' }}"
  # Re-lock on EVERY operation, including `update`: a template bump that touches
  # pyproject (e.g. a new optional-dependency) otherwise leaves a star with a
  # stale uv.lock that the admission gate's `uv sync --locked` rejects. No `when:`
  # -> runs on update too; `uv lock` is idempotent (no-op when already current).
  # GUARDED on uv's presence: renovate's copier artifact step runs tasks in a
  # container with no uv on PATH, and an exit-127 here made renovate DISCARD the
  # whole rendered update and ship its sentinel edit instead (urania #165,
  # measured 2026-08-05 -- the only update-lane task without a guard). Absent uv
  # degrades to a loud skip: a stale lock reds the PR gate visibly, which beats
  # an update that never lands at all.
  - command: command -v uv >/dev/null 2>&1 && uv lock || echo "uv absent -- lock refresh skipped (the PR gate will catch a stale lock)"
  # The two ENTROPY plugins are disabled fleet-wide (2026-08-18). They are not
  # tuned off for noise -- they are structurally incompatible with this fleet's
  # identifiers. MEASURED across the 26 baselines that carried rows: 531 of 612
  # rows (87%) came from HexHighEntropyString/Base64HighEntropyString, and of
  # the hex runs in the files they flagged, 65% were exactly 64 chars (graph
  # content addresses / name hashes) and 22% were exactly 40 (git SHAs).
  # detect-secrets already exempts the CANONICAL dashed UUID via its
  # is_potential_uuid filter ([a-f0-9]{8}-{4}-{4}-{4}-{12}); every un-dashed hex
  # form fires, and a 64-hex content address cannot be rendered as a UUID.
  # Not one of those 612 rows carried a review mark, so the baseline was not a
  # reviewed allowlist -- it was 612 unread suppressions in the one surface
  # nothing reads. The 25 FORMAT-SPECIFIC detectors (AWS, GitHub, Stripe, JWT,
  # PrivateKey, BasicAuth, Keyword, ...) all stay on and keep 81 real rows.
  # KNOWN COST, stated rather than discovered later: a high-entropy secret whose
  # format no named detector recognises -- a hex-encoded 32-byte key, say -- now
  # passes. That trade was made deliberately.
  - command: uvx detect-secrets@1.5.0 scan --disable-plugin HexHighEntropyString --disable-plugin Base64HighEntropyString > .secrets.baseline
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv run pre-commit install
    when: "{{ _copier_operation == 'copy' }}"
  # Spec-Driven Development scaffold. spec-kit init lays .specify/ (ps scripts +
  # core templates) and the claude speckit-* skills. NOTE: spec-kit no longer
  # git-inits (git is opt-in since 0.10.0) — the `git init -q` above is load-bearing.
  # `specify` must be on PATH. Runs BEFORE furnace ignite so the surface's
  # speckit-plan override skill (poured next) wins as last writer.
  - command: specify init --here --force --integration claude --script ps --ignore-agent-tools
    when: "{{ _copier_operation == 'copy' }}"
  # Cede CLAUDE.md to furnace: spec-kit's agent-context (the <!-- SPECKIT --> markers)
  # fights furnace's CLAUDE.md @AGENTS.md shim, which furnace repours every ignite.
  # Some spec-kit builds ship the extension already-uninstalled (`disable` then
  # errors "not installed" and would fail the whole strike); a blanket `|| true`
  # used to swallow THAT case, but it just as quietly swallowed a real `disable`
  # failure on a build where the extension IS present. Ask `list` first (always
  # exits 0, present-or-not) and only call `disable` when agent-context actually
  # shows up in it -- a real failure from that call now surfaces and rolls the
  # strike back, same as every other task here.
  # spec-kit's agent-context extension is NOT installed by default, so a bare
  # `specify extension disable agent-context` fails ("Extension 'agent-context'
  # is not installed") every single time this task runs -- the `|| true` and
  # `|| echo` spellings were masking a call that never once succeeded, not an
  # occasional idempotency edge. Guard on presence instead.
  #
  # NOT `specify extension list 2>/dev/null | grep -q`: that spelling discards
  # the list command's OWN failure, so a broken `.specify/` (from the task just
  # above) reads as "not installed" and the strike continues on a repo that
  # never got scaffolded. Capturing the output and checking its exit code keeps
  # that failure loud. Verified all three paths: not-a-project -> exit 1 (loud),
  # installed-but-absent -> exit 0 (clean skip), installed-and-enabled ->
  # disabled, exit 0.
  - command: >-
      bash -c 'out="$(specify extension list)" || exit 1;
      if echo "$out" | grep -q agent-context; then specify extension disable agent-context; fi'
    when: "{{ _copier_operation == 'copy' }}"
  # Pour the furnace governance kit (the .claude/ AI layer) as the final step.
  # code-repo-sdd = code-repo + the speckit surface (.specify/ overrides + the
  # speckit-plan command override + the forge-feature workflow). Must run AFTER
  # `specify init` so the override skill overwrites spec-kit's core one.
  # Needs `furnace` on PATH + $FURNACE_SOURCE set. A failure here rolls back the
  # whole stamp (copier task semantics) — intentional: no half-governed repo.
  # --hammer: this task is copy-only (strike), so the workdir is a born-fresh
  # copier+spec-kit scaffold with no real local edits to protect; ignite is the
  # designed last writer over it (it overwrites spec-kit's core speckit-plan skill),
  # so override stoke's clobber guard. The guard still protects an existing star on
  # anneal/update, which re-pours governance a different way (not via this copy-task).
  # The kit rides `mcp` alone (Flame C6, decoupled from the retired
  # `decentralized`): an mcp star is tofu-managed from the foundry core, so
  # furnace pours only the PR gates (code-repo-sdd); a plain
  # library takes the base code-repo-sdd.
  - command: furnace ignite . --hammer --kit {{ 'code-repo-sdd' if mcp else 'code-repo-sdd' }}
    when: "{{ _copier_operation == 'copy' }}"
  # NOTE: a star no longer scaffolds `/infra` (Flame C4) — the tofu roots live in
  # rob/infra, which harvests the sovereign shape from the star's {star}.tfvars.
  # copier needs no docker or Forgejo creds to stamp a star.
  # Verify the plan-command override resolves as the project-tier winner.
  - command: specify preset resolve speckit.plan
    when: "{{ _copier_operation == 'copy' }}"

# ONE-OFF SWEEP for v0.20.2: carry the fixed release recipe to stars already born.
#
# `justfile` is in `_skip_if_exists` above, so `copier update` will not deliver
# this — a versioned migration is the mechanism for exactly that case. It runs at
# the `after` stage, once copier has reapplied its diff, which is why a `_task`
# cannot do it: tasks run BEFORE that.
#
# The recipe shipped two defects (rob/python-repo-template#3143): it tagged
# without moving the version literal, and its own documented invocation
# `just release EXECUTE=1` silently dry-ran, because just reads NAME=value as a
# variable assignment and the recipe PARAMETER kept its "0" default.
#
# TWO ACCEPTED PRIOR SHAPES, not one. v0.20.1 fixed the recipe but left one
# header line still saying "pass EXECUTE=1" — contradicting the corrected note
# below it in the same block. A star that already updated to v0.20.1 therefore
# holds neither the original nor the final text, and a single-variant sweep
# would skip it and report it as hand-modified. Both are matched; both land on
# the same corrected block.
#
# EXACT-MATCH, NEVER A GUESS. A star whose recipe matches neither shape is
# REPORTED and LEFT ALONE — this file's standard is that "a merge silently
# guesses", and clobbering a local edit would be that sin in a new coat.
#
# Payloads are base64 because this command is Jinja-rendered AND shell-embedded
# AND Python-embedded, and the blocks contain `{{EXECUTE}}`, which Jinja would
# otherwise eat. Regenerate with:
#   git show <sha>:template/justfile | python3 -c 'import base64,sys;print(base64.b64encode(sys.stdin.buffer.read()).decode())'
_migrations:

  # ONE-OFF SWEEP for v0.25.13: carry the untracked-file lint fix to stars
  # already born. Same mechanism, same reasons, same safety rules as the
  # v0.20.2 sweep below — read that block first; this one only restates what
  # differs.
  #
  # ⚑ WHY A MIGRATION AND NOT JUST THE TEMPLATE EDIT. `justfile` is in
  # `_skip_if_exists`, so the fix in #86 (v0.25.11) reaches NEWLY GENERATED
  # repos ONLY. `copier update` does not deliver it and cannot — measured
  # 2026-08-20 on mnemosyne, which updated v0.25.4 -> v0.25.11, took the
  # .pre-commit-config.yaml changes, and did NOT take the justfile. The fix had
  # to be hand-carried there. eris still carries the defect (v0.25.3), and any
  # Python star born before #86 landed would too.
  #
  # DRY-RUN AGAINST THE REAL CONSUMERS before this was written, not after:
  #   eris       v0.25.3   -> sweeps, file changes
  #   mnemosyne  v0.25.11  -> no-op, already carries the fix by hand
  #   vault-mcp            -> NOT AFFECTED. It has no justfile at all; its
  #                           --all-files runs in CI, where everything is
  #                           committed by definition, so there is no untracked
  #                           file to be blind to. The blind spot needs a LOCAL
  #                           gate. An earlier note of mine claimed otherwise.
  #
  # THE DEFECT IT CARRIES. `pre-commit run --all-files` means every file GIT
  # KNOWS ABOUT, so a newly written module is invisible to lint until it is
  # staged: `just check` passes green and the commit hook then fails on the
  # same file for findings the gate just said were not there. It bit mnemosyne
  # three times in two days — five ruff findings in one new module, a TC003 in
  # a new eris test, and a D107 in a new module during a later session, all
  # through a green gate.
  #
  # ONE PRIOR SHAPE, not two. The whole history of this recipe is two versions:
  # the original four-liner, byte-identical across 0818145..2c49000, and the
  # fixed block from 715df90. Verified by hashing the block at every commit
  # that touched template/justfile.
  #
  # IDEMPOTENT, which matters more here than for v0.20.2: mnemosyne already
  # carries the fix by hand, so this MUST no-op there rather than double-apply.
  # The `NEW in t` guard is what makes that true.
  #
  # Regenerate the payloads with:
  #   git show <ref>:template/justfile | python3 -c 'import sys;
  #     t=sys.stdin.read(); s=t.index("# Format + lint"); e=t.index("# BOTH type checkers");
  #     import base64; print(base64.b64encode(t[s:e].encode()).decode())'
  - version: v0.25.13
    when: "{{ _stage == 'after' }}"
    command: |
      python3 - <<'SWEEP'
      import base64, pathlib, sys
      PRIOR = [base64.b64decode("IyBGb3JtYXQgKyBsaW50IHZpYSB0aGUgcmVwbydzIHByZS1jb21taXQgaG9va3MgKHJ1ZmYgZXQgYWwuKQpsaW50OgogICAgdXYgcnVuIHByZS1jb21taXQgcnVuIC0tYWxsLWZpbGVzIC0tc2hvdy1kaWZmLW9uLWZhaWx1cmUKCg==").decode()]
      NEW = base64.b64decode("").decode()
      p = pathlib.Path("justfile")
      if not p.exists():
          print("copier: no justfile here - nothing to sweep"); sys.exit(0)
      t = p.read_text(encoding="utf-8")
      if NEW in t:
          print("copier: lint already sees untracked files"); sys.exit(0)
      for old in PRIOR:
          if old in t:
              p.write_text(t.replace(old, NEW, 1), encoding="utf-8")
              print("copier: swept the lint recipe - `just lint` now covers "
                    "untracked files, which --all-files cannot see")
              sys.exit(0)
      print("copier: the lint recipe matches no shape this template shipped -")
      print("copier: LEAVING IT ALONE. Reconcile by hand against v0.25.13.")
      SWEEP
  - version: v0.20.2
    when: "{{ _stage == 'after' }}"
    command: |
      python3 - <<'SWEEP'
      import base64, pathlib, sys
      PRIOR = [base64.b64decode("").decode(),
               base64.b64decode("").decode()]
      NEW = base64.b64decode("").decode()
      p = pathlib.Path("justfile")
      if not p.exists():
          print("copier: no justfile here - nothing to sweep"); sys.exit(0)
      t = p.read_text(encoding="utf-8")
      if NEW in t:
          print("copier: release recipe already carries the fix"); sys.exit(0)
      for old in PRIOR:
          if old in t:
              p.write_text(t.replace(old, NEW, 1), encoding="utf-8")
              print("copier: swept the release recipe - it now moves the version "
                    "literal and does not tag")
              print("copier: invoke it as `just release 1`, NOT `just release EXECUTE=1`")
              sys.exit(0)
      print("copier: the release recipe matches no shape this template shipped -")
      print("copier: LEAVING IT ALONE. Reconcile by hand against v0.20.2.")
      SWEEP
