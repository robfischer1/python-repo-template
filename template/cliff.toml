# cliff.toml — CHANGELOG.md generation (git-cliff). Invariant, copier-shipped.
#
# Poured VERBATIM (no .jinja suffix): git-cliff templates are Tera, which shares
# {{ }} delimiters with Jinja, so a .jinja suffix here would have copier eat
# every template expression at pour time. Same trap the justfile documents.
#
# CHANGELOG.md is DERIVED. Never hand-edit it — run `just changelog`.
# Entries carry their commit sha rather than the commit body: the rationale is
# already written in the commit, and a second copy is a second thing to drift.

[changelog]
header = """
# Changelog

GENERATED by git-cliff from the commit log — do not hand-edit.
Regenerate with `just changelog`.

Each entry carries its commit sha; the full rationale lives in the commit
body — read it with `git show <sha>`.

The format follows [Keep a Changelog](https://keepachangelog.com); this
project adheres to [Semantic Versioning](https://semver.org).

"""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}** — {% endif %}{{ commit.message | upper_first }} `{{ commit.id | truncate(length=8, end="") }}`
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
split_commits = false
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # Strip a hand-stamped version suffix ("— 0.16.3"); the heading already says it.
  { pattern = '(?m) +[—-] +v?[0-9]+\.[0-9]+\.[0-9]+ *$', replace = "" },
  # Strip the door's PR suffix ("— PR #144").
  { pattern = '(?m) +[—-] +PR #[0-9]+ *$', replace = "" },
]

# Order matters — first match wins. The skips come first so a `chore(deps)`
# never reaches the `^chore` catch-all, and neither reaches a group.
commit_parsers = [
  { message = "^deploy", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^docs", skip = true },
  { message = "^fixup", skip = true },
  { message = "^wip", skip = true },
  { message = "^revert", group = "Removed" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^deprecat", group = "Deprecated" },
  { message = "^remove", group = "Removed" },
]

[bump]
# Seed the FIRST tag v-prefixed. Without this a never-tagged repo seeds at a
# bare "0.1.0" while an already-tagged one inherits its own "v" prefix — which
# would split the fleet's tag convention on the day the untagged stars are
# seeded. Measured: athena (0 tags) -> 0.1.0 without it, v0.1.0 with it.
initial_tag = "v0.1.0"
