# Pre-commit hooks — the LOCAL half of the CI gate, so local and CI cannot drift.
# pre-commit stage: fast lint/hygiene (ruff, ruff-format, detect-secrets) + the
# forge-testkit test-body checks. pre-PUSH stage: the heavy checks the reusable
# python ci.yml runs (mypy, pyright, pytest, pip-audit, opengrep) — kept off
# `pre-commit` so commits stay fast, but run before a push reaches the door/CI.
# CI (the baked image) is the hard enforce; a dev box missing a non-project tool
# (opengrep) gets a notice, not a block.
#
# Install (copier _tasks does this on scaffold): `uv run pre-commit install`.
# default_install_hook_types wires pre-commit + pre-push in that one call. The
# .secrets.baseline is generated on first scaffold via `detect-secrets scan`.
#
# furnace owns .claude/ .specify/ .furnace/ (deployed by `furnace stoke`/`quench`).
# Exclude that managed surface from every hook: hygiene fixers would mangle the
# deployed content into drift, and detect-secrets trips on the manifest's hashes.
default_install_hook_types: [pre-commit, pre-push, post-commit]
exclude: '^\.(claude|specify|furnace)/|(^|/)(vendor|node_modules)/|\.melt$'
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff            # lint (uses [tool.ruff] in pyproject)
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format     # format enforcement — the gate is a thing reality checks
        stages: [pre-commit]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^tests/fixtures/
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # trailing-whitespace REMOVED 2026-08-16, on the same evidence that retired
      # end-of-file-fixer above. MEASURED across 6 repos / 998 tracked source files
      # (py, go, rs, ts, tsx, md, yml, toml; vendor excluded): 7 files carry trailing
      # whitespace — 0.7%, the same near-zero yield, and a fixer that rewrites a file
      # under a running commit for it. A hook that earns nothing does not get kept
      # because it is cheap; it gets deleted.
      # end-of-file-fixer REMOVED 2026-08-08 — it earned nothing and cost an outage.
      #
      # MEASURED across 40 repos / 8276 in-scope text files, applying each repo's `exclude`
      # and the hook's own `types: [text]`: 62 files would change (0.75%), and NOT ONE is a
      # source file in any language. ruff-format / rustfmt / gofmt / prettier already
      # guarantee a final newline on anything a human writes, and .editorconfig has carried
      # `insert_final_newline = true` the whole time. The 62 are generated trees (Tauri
      # gen/android, spec-kit .specify/, public/ assets), SVG/XML icons, and one GOLDEN test
      # fixture ending \n\n on purpose — files where the "fix" is wrong, futile, or both.
      #
      # The cost is not hypothetical. Its only real catches are machine-generated files, and
      # on 2026-08-08 that meant a 24-repo red-CI cascade over renovate's unterminated
      # `#copier updated` sentinel — charged to PRs that never touched the file, because
      # .copier-answers.yml is inert to the gate (rob/renovate-config#2558). It also cannot
      # run in a forge-git-locked primary at all: it opens every file `rb+` before knowing
      # whether it has a change to make, so a-w tracked files raise PermissionError
      # (rob/foundry-stocks#2563).
      #
      # WHAT THIS GIVES UP: it was the canary that surfaced that sentinel jam, so a future
      # generator bug of the same shape now lands quietly. Accepted — it signalled by
      # breaking everyone else's CI and naming the wrong PR, and the jam's real symptom (a
      # frozen copier manager) is now watched at the source fix instead.
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
  # Local hooks. forge-testkit test-body checks run at pre-commit; the CI-parity
  # heavy gate (mypy/pyright/pytest/pip-audit/opengrep) runs at pre-push.
  #
  # Resolve forge-testkit through the project's uv env (the forgejo index is
  # configured in [tool.uv.sources]) rather than a bare-pip isolated env, which has
  # no forgejo index and fails locally. `--extra dev` guarantees the extra is synced
  # first, so the hook works on a fresh checkout too.
  #
  # language: SYSTEM, not python. A `language: python` hook builds an ISOLATED env
  # and installs additional_dependencies into it — bare pip under pre-commit (hence
  # the PIP_EXTRA_INDEX_URL patch, foundry-stocks#178) and `uv pip install
  # --project /` under prek, which ignores this project's uv.sources and fails
  # identically. Either runner needs an index env var to pull a PRIVATE package into
  # a throwaway env; the variable just changes name.
  #
  # The entry keeps its own `uv run` rather than relying on the caller's: a bare
  # `forge-testkit-lint` only resolves when the runner was itself launched inside the
  # uv env, so `prek run` / `pre-commit run` invoked standalone (uvx) fail on it.
  #
  # CI-parity gate: language: system + `uv run` so it uses the project's synced env —
  # the same interpreter+deps CI uses (uv sync --all-extras), so a green pre-push
  # means a green CI. Type/test tools are project dev-deps (always present via uv
  # run); opengrep is a system binary, so it degrades to a notice when absent.
  - repo: local
    hooks:
      - id: forge-testkit-assertion-free
        name: assertion-free test bodies (forge-testkit)
        entry: uv run --extra dev forge-testkit-lint assertion-free
        language: system
        files: ^tests/.*\.py$
        types: [python]
        stages: [pre-commit]
      - id: forge-testkit-fake-placement
        name: FakeX placement (forge-testkit)
        entry: uv run --extra dev forge-testkit-lint fake-placement
        language: system
        files: \.py$
        types: [python]
        stages: [pre-commit]
      # F13 — the per-verb MCP schema budget. Every registered verb's wire
      # description is a fleet-wide cost: it ships in the tool manifest on every
      # session's first turn, whether or not the verb is ever called. The check
      # has a FLOOR as well as a ceiling, because a ceiling alone rewards
      # deleting the docstring — measured, that left the suite green while
      # inverting the feature. Exemption (`[tool.forge_testkit_lint]
      # schema_budget_exempt`) is permission to be long, never to be absent.
      #
      # Unconditional, not `{% if mcp %}`: this file is copied verbatim (copier's
      # _templates_suffix leaves it unrendered), and on a non-MCP repo the check
      # finds no registered verbs and passes. Nothing to gate.
      - id: forge-testkit-schema-budget
        name: MCP verb schema budget (forge-testkit)
        entry: uv run --extra dev forge-testkit-lint schema-budget
        language: system
        files: ^src/.*\.py$
        types: [python]
        stages: [pre-commit]
      # --all-extras ON ALL THREE, and it is what makes the name true. These
      # hooks say "CI parity"; the image installs the project's extras
      # (`uv sync --locked --no-dev --extra pg --extra kafka`) and these hooks
      # did not, so a lazily-imported optional dependency was unresolvable to
      # mypy and pyright locally while CI resolved it fine. Measured 2026-08-22:
      # 19 repos, every one of them, because this file pours it — nyx failed
      # `uv run mypy src tests` with 1 error and passed `--all-extras` with 0.
      #
      # `--all-extras` rather than naming them: extras are per-repo (kafka, pg,
      # mtls, claims, classes, http, testing across the fleet) and this template
      # cannot know which a consumer declares. For a type check, installing more
      # than the image only ever improves resolution.
      #
      # The alternative — an ignore_missing_imports override — silences mypy
      # only, leaves pyright's reportMissingImports failing, and suppresses a
      # checker that was correctly reporting a real gap in its own environment.
      - id: mypy
        name: mypy (CI parity — pre-push)
        entry: uv run --all-extras mypy src tests
        language: system
        stages: [pre-push]
        pass_filenames: false
        types: [python]
      - id: pyright
        name: pyright (CI parity — pre-push)
        entry: uv run --all-extras pyright
        language: system
        stages: [pre-push]
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (CI parity — pre-push)
        entry: uv run --all-extras pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        types: [python]
      - id: pip-audit
        name: pip-audit dependency vuln scan (CI parity — pre-push)
        entry: uv run --with pip-audit pip-audit
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: opengrep-sast
        name: opengrep SAST (CI parity - pre-push; notice if absent)
        # REFUSES A ZERO-FILE SCAN. `Ran N rules on 0 files: 0 findings` exits 0 and
        # renders as Passed, which is indistinguishable from a clean scan. That is not
        # hypothetical: go-repo-template and rust-repo-template shipped the PYTHON
        # ruleset verbatim, so EVERY Go and Rust star ran a security gate that had
        # never examined a single file, and reported success every time
        # (foundry-stocks#4415). cerberus was worse - 29 .py and 37 .rs, so the count
        # looked plausible while the whole Rust surface went unscanned.
        #
        # Fixing the two rulesets fixes the instances. This fixes the CLASS: any future
        # languages/file-type mismatch is now loud on the first run instead of silent
        # forever. Same principle as the CANNOT-RUN branch below - a check that cannot
        # see anything must not answer "fine".
        #
        # Inline rather than a foundry-stocks script, deliberately: the opengrep hook
        # has no FOUNDRY_STOCKS dependency today, and stars still on the per-family
        # gates do not provision foundry-stocks on the go/rust/frontend lanes. Adding
        # that coupling mid-migration would break them.
        entry: >-
          bash -c 'command -v opengrep >/dev/null 2>&1 ||
          { echo "opengrep: CANNOT RUN - not installed (https://github.com/opengrep/opengrep). It is baked into every CI image, so this is a local gap only. Refusing to report success without scanning." >&2; exit 2; };
          export LANG=C.UTF-8 LC_ALL=C.UTF-8;
          out=$(opengrep scan --config rules/sast --error . 2>&1); rc=$?;
          printf "%s\n" "$out";
          if printf "%s" "$out" | grep -qE "Ran [0-9]+ rules on 0 files"; then
          echo "opengrep: REFUSING a zero-file scan. The ruleset matched no file in this repo, so 0 findings means NOTHING WAS EXAMINED - not that the code is clean. Check that rules/sast/dataflow.yml declares the language(s) this repo is actually written in." >&2;
          exit 2; fi;
          exit $rc'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: worktree-guard
        name: commit from a linked worktree, not the shared checkout
        entry: >-
          bash -c 'S="${FOUNDRY_STOCKS:-}"; C="${STOCKS_CACHE:-}";
          P=ci/lib/verified_worktree.py;
          if [ -n "$C" ]; then
          git -C "$C" cat-file -e "$S:$P" 2>/dev/null || {
          echo "worktree-guard: CANNOT RUN - STOCKS_CACHE is set, so FOUNDRY_STOCKS must be a git REF carrying $P; got ref=$S cache=$C" >&2;
          echo "worktree-guard: refusing to fall back to a possibly-drifted checkout, and refusing to report success without checking." >&2;
          exit 2; };
          t=$(mktemp); git -C "$C" show "$S:$P" >"$t"; python3 "$t" .; rc=$?; rm -f "$t"; exit $rc; fi;
          if [ -n "$S" ] && [ -f "$S/$P" ]; then python3 "$S/$P" .; exit $?; fi;
          G=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null);
          D="${G%/.git}/../foundry-stocks";
          if [ -f "$D/$P" ]; then python3 "$D/$P" .; exit $?; fi;
          echo "worktree-guard: CANNOT RUN - no canonical source (FOUNDRY_STOCKS=$S STOCKS_CACHE=$C)" >&2;
          echo "worktree-guard: set STOCKS_CACHE plus a FOUNDRY_STOCKS git REF (canonical gate), or FOUNDRY_STOCKS as a checkout PATH. Refusing to report success without checking." >&2;
          exit 2'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      # A branch cut off a stale local main is a rebase nobody asked for. The
      # background fetch after every commit keeps origin/* fresh so the next
      # branch starts from what the door actually holds. Backgrounded and
      # detached: a slow network delays no commit, and a failed fetch is a
      # no-op rather than a broken post-commit.
      #
      # Absent from THIS template alone until now — go, rust and frontend have
      # carried it since their creation, python never received it. The eight
      # python repos that have it got it from the retired furnace scaffold
      # pour, not from here.
      - id: fetch-origin
        name: fetch origin (keep refs fresh)
        entry: bash -c '(git fetch origin --prune --quiet >/dev/null 2>&1 </dev/null &)'
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      # stop-justifications — a suppression is a claim that the tool is wrong.
      # This refuses to let that claim be filed silently, in any of the four
      # languages, for any tool the reusable gates actually run.
      #
      # One definition in foundry-stocks (ci/lib/stop_justifications.py) so all
      # four templates forbid the SAME list. Copying the list into each template
      # is the defect it exists to catch: on 2026-08-16 a sweep found 533 noqa
      # on one rule, 368 of them EIGHT decisions replicated into 46 repos by a
      # scaffold pour — every copy carrying the same justification comment that
      # nobody had re-read, because it was cp'd rather than written.
      #
      # THE ESCAPE IS PROSE, NOT A CODE. When two tools genuinely disagree the
      # more permissive one yields, and the line says which:
      #     x = cast(int, y)  # <directive>  # tool-conflict: <what disagrees>
      # A code would be copyable without thought, which is the failure this
      # exists to stop. Bare `tool-conflict:` with no prose does not excuse.
      #
      # IT DOES NOT FAIL SOFT. No foundry-stocks means exit 2 — "could not run",
      # never "passed". pre-commit hides a passing hook's output, so a hook that
      # skipped quietly would be indistinguishable from one that scanned clean,
      # which is the same silent-success defect the gate is here to remove. CI
      # provides it explicitly. TWO CONTRACTS, both honoured here: the CANONICAL
      # gate (foundry-stocks#506) sets STOCKS_CACHE to a bare clone and
      # FOUNDRY_STOCKS to a git REF, and the script is read out of that cache at
      # that ref — local == CI by construction. Older callers set FOUNDRY_STOCKS
      # to a checkout PATH. With STOCKS_CACHE set, an unresolvable ref REFUSES
      # rather than falling back to a sibling working tree, because scanning a
      # drifted copy is the exact class of staleness this hook exists to catch.
      - id: stop-justifications
        name: "no silent suppression of any gate - excuse with a tool-conflict line"
        entry: >-
          bash -c 'S="${FOUNDRY_STOCKS:-}"; C="${STOCKS_CACHE:-}";
          P=ci/lib/stop_justifications.py;
          if [ -n "$C" ]; then
          git -C "$C" cat-file -e "$S:$P" 2>/dev/null || {
          echo "stop-justifications: CANNOT RUN - STOCKS_CACHE is set, so FOUNDRY_STOCKS must be a git REF carrying $P; got ref=$S cache=$C" >&2;
          echo "stop-justifications: refusing to fall back to a possibly-drifted checkout, and refusing to report success without scanning." >&2;
          exit 2; };
          t=$(mktemp); git -C "$C" show "$S:$P" >"$t"; python3 "$t" .; rc=$?; rm -f "$t"; exit $rc; fi;
          if [ -n "$S" ] && [ -f "$S/$P" ]; then python3 "$S/$P" .; exit $?; fi;
          G=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null);
          D="${G%/.git}/../foundry-stocks";
          if [ -f "$D/$P" ]; then python3 "$D/$P" .; exit $?; fi;
          echo "stop-justifications: CANNOT RUN - no canonical source (FOUNDRY_STOCKS=$S STOCKS_CACHE=$C)" >&2;
          echo "stop-justifications: set STOCKS_CACHE plus a FOUNDRY_STOCKS git REF (canonical gate), or FOUNDRY_STOCKS as a checkout PATH. Refusing to report success without scanning." >&2;
          exit 2'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
