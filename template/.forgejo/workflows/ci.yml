# Caller stub (Flame pull-CI) — logic lives in foundry/foundry-stocks; invariant,
# copier-shipped. Retires the ci.tf pour + the launcher/channel.
# ON THE CANONICAL GATE (wave 3, foundry-stocks#4839 / #597). This stub used to call
# foundry-stocks' ci.yml — one of the four LEGACY per-family gates, which are
# being deleted. It now calls the one canonical gate.yml and names its lane explicitly.
#
# THE TEMPLATE WAS THE LAST THING STILL POINTING AT THE LEGACY GATES. All 47 stars were
# migrated by hand between 2026-08-19 and 2026-08-21; the templates were not, so every
# newly-stamped star got a legacy stub and every `copier update` was one template-side
# edit away from dragging a migrated star back. It survived this long only because the
# shipped stub happened not to change, so copier's 3-way merge kept each star's local
# repoint.
#
# `lane:` IS THE ONLY THING THAT CARRIES THE FAMILY NOW. gate.yml picks the container
# image from it, and its push path reads the lane declared HERE to decide which of
# build.yml's four unconditional gate calls belongs to this star. The filename does not
# select anything.
name: ci
on:
  # NO paths-ignore, deliberately. A filtered-out PR runs no workflow and therefore
  # posts NO STATUS, and a required status check that never reports blocks its PR
  # forever — which is exactly why branch_protection.tf still carries
  # enable_status_check = false fleet-wide.
  #
  # Nothing is lost by removing it: the reusable gate already skips inert-only PRs
  # INTERNALLY (its "Detect source changes" step gates every work step with `if:`),
  # and its own comment names this as the reason — "the job still RUNS and reports
  # SUCCESS ... so a required check / ourea ci_await never hangs". The filter's three
  # patterns were `infra/**` (no star repo has one), `.forgejo/**` and `**.md` (both
  # already in the gate's inert regex). Behaviour is unchanged; a status now exists.
  pull_request:
jobs:
  ci:
    uses: foundry/foundry-stocks/.forgejo/workflows/gate.yml@main
    with:
      lane: python
    # pragma comment: detect-secrets flags the word 'secrets' as a Secret Keyword,
    # and `secrets: inherit` is the reusable-workflow idiom, not a credential.
    secrets: inherit  # pragma: allowlist secret
