# ci-matrix.toml — this template's render matrix. THE ONLY THING THIS REPO OWNS
# ABOUT ITS OWN CI: the gate logic is generic and lives once, in
# foundry-stocks/ci/lib/template_render_matrix.py, called through the
# `template-ci.yml` reusable workflow. Variance is data; adding a variant is a
# TOML edit, never a workflow edit.
parse = ["**/*.toml", "**/*.json"]

# The file-set variance is `variant` (a library is a distribution and renders no
# service skeleton), `mcp` (server.py) and `tooling_only` (no src/tests at all).
# A star is the container ignore-file's gate. The remaining answers
# (`sovereign_database`, `core_backed`) change CONTENT ONLY — same file list,
# different pyproject.toml — which is exactly why they still get cases: tier 2
# parses what they render, so an unquoted or malformed branch in the pyproject
# jinja is caught rather than shipped into the next star.
#
# `.forgejo` IS ASSERTED ABSENT IN EVERY CASE, and that is a guard rather than
# a tidy-up. The workflow files this template used to pour were caller stubs
# for the act-runner, which retired; the gate is the door's runner now. The
# directory is gone from template/, so the only way it can come back is
# somebody re-adding it — which is exactly the event worth reddening a case.
# Whole-directory, not per-file: a new workflow nobody thought to list here
# would otherwise arrive unnoticed.

[[case]]
# A STAR: a service. The whole service skeleton is born with it: the op-contract
# trio, the settings they read, the oneiroi emission stub, and the FastMCP
# server when `mcp` is true.
name = "star"
answers = { project_name = "Gate Py", variant = "star", mcp = true }
present = [
  ".gitignore",                    # F5a: the pre-wrapped managed block
  "src/gate_py/server.py",         # the FastMCP entrypoint - mcp only
  "src/gate_py/settings.py",
  "src/gate_py/health.py",
  "src/gate_py/heartbeat.py",
  "src/gate_py/observability.py",
  "src/gate_py/oneiroi.py",
  "pyproject.toml",
  ".dockerignore",                 # containerised: build context matters
  "tests/test_smoke.py",
  # The no-network guard is born with the repo, not adopted after an incident:
  # the autouse fixture and the tests that prove it. Unconditional (no copier
  # answer gates them), so the library case pins them too.
  "tests/conftest.py",
  "tests/test_network_guard.py",
]
absent = [".forgejo", "src/gate_py/__main__.py"]

[[case]]
# A STAR WITHOUT MCP still has the whole skeleton (heartbeat, health, settings,
# observability, oneiroi) and no server. The settings that heartbeat.py reads
# (kafka_bootstrap, heartbeat_topic) must exist whenever heartbeat.py renders:
# they were mcp-gated while heartbeat was not, so every mcp:false render failed
# mypy. This case pins the file set; the settings content is one unconditional
# block in settings.py.jinja.
name = "star-no-mcp"
answers = { project_name = "Gate Py", variant = "star", mcp = false }
present = [
  "pyproject.toml",
  "src/gate_py/settings.py",
  "src/gate_py/health.py",
  "src/gate_py/heartbeat.py",
  "src/gate_py/observability.py",
  "src/gate_py/oneiroi.py",
  "tests/test_smoke.py",
]
absent = [".forgejo", "src/gate_py/server.py"]

[[case]]
# `variant: library` MEANS A DISTRIBUTION, NOT A SERVICE (Rob's ruling,
# 2026-10-23, python-repo-template#22568). A published wheel is not run, so it
# is born with no service skeleton: no settings, no op-contract, no heartbeat,
# no observability or oneiroi stub. The crossing against the star cases is the
# guard: a fat-fingered gate reds one of the neighbours instead of shipping the
# wrong shape quietly. (Until v0.40.0 this case pinned the op-contract PRESENT,
# on the reasoning that the only two subscribers were libraries; that was the
# bug: a library does not run a heartbeat.)
name = "library"
answers = { project_name = "Gate Py", variant = "library", mcp = false }
present = [
  ".gitignore",                    # F5a: the pre-wrapped managed block
  "pyproject.toml",
  "src/gate_py/__init__.py",
  "tests/test_smoke.py",            # the version check
  "tests/conftest.py",              # the guard is not a star-only thing
  "tests/test_network_guard.py",
]
absent = [
  ".forgejo",
  "src/gate_py/settings.py",
  "src/gate_py/health.py",
  "src/gate_py/heartbeat.py",
  "src/gate_py/observability.py",
  "src/gate_py/oneiroi.py",
  # Nothing container-shaped may render for a plain library.
  "src/gate_py/server.py",
  ".dockerignore",
]

[[case]]
# A LIBRARY THAT IS ALSO AN MCP SERVER (vault-mcp's shape). server.py is gated on
# `mcp` alone and imports settings (host/port) and, in main(), heartbeat (which
# imports health). Those three stay; observability and oneiroi are skeleton
# nothing imports, so they do not render.
name = "library-mcp"
answers = { project_name = "Gate Py", variant = "library", mcp = true }
present = [
  "pyproject.toml",
  "src/gate_py/server.py",
  "src/gate_py/settings.py",
  "src/gate_py/health.py",
  "src/gate_py/heartbeat.py",
  "tests/test_smoke.py",
]
absent = [
  ".forgejo",
  ".dockerignore",
  "src/gate_py/observability.py",
  "src/gate_py/oneiroi.py",
]

[[case]]
# THE SDK'S OWN ANSWER, and it is here for tier 2 rather than tier 1: the file
# list is a library's, and what differs is the pyproject — `is_sdk = true` drops
# the `stellar-core` dependency, because the one repo that PROVIDES the
# op-contract must not depend on itself. Same reason sovereign-db and core-backed
# have cases: content-only variance still gets parsed, so a malformed branch in
# the jinja reds here instead of shipping into the SDK's own manifest.
name = "is-sdk"
answers = { project_name = "Gate Py", variant = "library", mcp = false, is_sdk = true }
present = [
  ".gitignore",                    # F5a: the pre-wrapped managed block
  "pyproject.toml",
  # THE ONE PRODUCT MODULE THE SDK STILL RECEIVES, and it is pinned PRESENT on
  # purpose: a path that leaves the render set is DELETED from the destination
  # (`_skip_if_exists` governs overwrite, not existence — measured against the
  # real repo, which lost its 273-line runner to v0.34.2). The SDK owns this
  # path, so the template must keep claiming it and let skip_if_exists preserve
  # the content. If this line ever flips to `absent`, stellar-core loses its
  # heartbeat runner on its next update.
  "src/gate_py/heartbeat.py",
]
absent = [
  ".forgejo",
  ".dockerignore",
  # A STAR'S STUB OF THE OP-CONTRACT IS CIRCULAR IN THE REPO THAT PROVIDES IT:
  # health.py reads `from stellar_core import HealthState`, so the SDK owning one
  # imports itself. Same for the settings/oneiroi scaffolding and the born-with
  # smoke test, which exercise a star's shape. The SDK has its own suite.
  "src/gate_py/health.py",
  "src/gate_py/observability.py",
  "src/gate_py/settings.py",
  "src/gate_py/oneiroi.py",
  "tests/test_smoke.py",
]

[[case]]
# TOOLING-ONLY: the whole point is what is NOT here. A rust (or any non-python)
# repo shipping scripts wants the python lane's pyproject and nothing of the
# service skeleton, and the only durable way to withhold the skeleton is a path
# outside the render set (a hand-deleted file is poured back by the next
# `copier update`). `src` and `tests` are gated WHOLE, so conftest.py (which
# imports forge_testkit) and __init__.py go with them.
name = "tooling-only"
answers = { project_name = "Gate Py", variant = "binary", mcp = false, tooling_only = true }
present = [".gitignore", "pyproject.toml", ".python-version"]
absent = [
  ".forgejo",
  "src",
  "tests",
  "src/gate_py/__init__.py",
  "src/gate_py/heartbeat.py",
  "src/gate_py/health.py",
  "src/gate_py/observability.py",
  "src/gate_py/settings.py",
  "src/gate_py/oneiroi.py",
  "tests/test_smoke.py",
  "tests/test_network_guard.py",
  "tests/conftest.py",
]

[[case]]
name = "sovereign-db"
answers = { project_name = "Gate Py", mcp = true, sovereign_database = true }
present = [".gitignore", "pyproject.toml", "src/gate_py/server.py"]
absent = [".forgejo"]

[[case]]
name = "core-backed"
answers = { project_name = "Gate Py", mcp = true, core_backed = true }
present = [".gitignore", "pyproject.toml", "src/gate_py/server.py"]
absent = [".forgejo"]

# THE TWO MUTATION CASES ARE GONE, AND THEIR ABSENCE IS THE FINDING.
# `no-mutation-gate-by-default` and `mutation-gate-when-declared` (Test
# Hardening C1) asserted that naming a critical module stamps a mutation stub
# and that not naming one does not. Both asserted ONE artifact —
# the mutation workflow stub — and it left with the act-runner.
#
# `critical_modules` now renders NOTHING: it is a copier question with no
# output, and there is no mutation atom in foundry-tools to take the work over.
# Keeping the cases would have meant two cases that pass while proving nothing,
# which is worse than no case at all — a vacuous pass is the failure mode this
# whole file exists to refuse. Re-add them the moment the mutation gate has a
# home again.
